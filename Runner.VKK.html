    function initAudio() {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); musicGain = audioCtx.createGain(); musicGain.gain.value = 0.15; musicGain.connect(audioCtx.destination); }

    }

    function playJumpSound() { if (!audioCtx) return; const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2); }

    function playMusicLoop() {

    function saveData() {

        localStorage.setItem('runnerCryptostals', cryptostals); localStorage.setItem('runnerPassXP', passXP);

    function isSkinAvailableForCharacter(skinId) {
      const skin = ALL_SKINS[skinId.toUpperCase()];
      if (!skin) return false;
      if (!skin.onlyFor) return true;
      return skin.onlyFor.includes(currentCharacter.id);
    }

    function addPassXP(amount) {
      passXP += amount;
      while (passXP >= PASS_XP_PER_LEVEL) {
        passXP -= PASS_XP_PER_LEVEL;
        passLevel++;
        const rewardType = Math.random() < 0.5 ? 'crystals' : 'cryptostals';
        if (rewardType === 'crystals') crystals += 5000;
        else cryptostals += 2500;
        for (let i = 0; i < 20; i++) {
          fireworks.push({ x: Math.random() * CANVAS_WIDTH, y: Math.random() * CANVAS_HEIGHT * 0.5, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 6 - 2, life: 40 + Math.random() * 30, color: ['#ff0', '#f00', '#0f0', '#00f', '#f0f'][Math.floor(Math.random() * 5)] });
        }
      }
      saveData();
    }

    function generatePassQuests() {
      const quests = [
        { desc: 'Дойди до счёта 10000', type: 'score', target: 10000, xp: 150 },
        { desc: 'Дойди до счёта 25000', type: 'score', target: 25000, xp: 200 },
        { desc: 'Дойди до счёта 50000', type: 'score', target: 50000, xp: 300 },
        { desc: 'Побей свой рекорд', type: 'record', xp: 200 },
        { desc: 'Поиграй за скин Золотой', type: 'skin', skin: 'golden', xp: 100 },
        { desc: 'Поиграй за скин Космический', type: 'skin', skin: 'cosmic', xp: 150 },
        { desc: 'Поиграй за персонажа Пантера', type: 'character', character: 'panther', xp: 200 },
        { desc: 'Поиграй за персонажа Медвежонок', type: 'character', character: 'bear', xp: 200 },
        { desc: 'Поиграй за персонажа Котик', type: 'character', character: 'cat', xp: 150 },
        { desc: 'Поиграй за скин Умный', type: 'skin', skin: 'smart', xp: 180 }
      ];
      passQuests = [];
      const used = new Set();
      while (passQuests.length < 4) {
        const q = quests[Math.floor(Math.random() * quests.length)];
        if (!used.has(q.desc)) { used.add(q.desc); passQuests.push({...q}); }
      }
      passClaimed = new Array(passQuests.length).fill(false);
      lastPassReset = new Date().toISOString();
      saveData();
    }

    function resetPassIfNeeded() {
      const now = new Date();
      if (lastPassReset) {
        const lastReset = new Date(lastPassReset);
        const hoursPassed = (now - lastReset) / (1000 * 60 * 60);
        if (hoursPassed >= PASS_RESET_HOURS) generatePassQuests();
      } else {
        generatePassQuests();
      }
    }

    function getPassTimeRemaining() {
      if (!lastPassReset) return '00:00:00';
      const now = new Date();
      const lastReset = new Date(lastPassReset);
      const nextReset = new Date(lastReset.getTime() + PASS_RESET_HOURS * 60 * 60 * 1000);
      const remaining = nextReset - now;
      if (remaining <= 0) return 'Обновление...';
      const hours = Math.floor(remaining / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function checkPassQuests() {
      passQuests.forEach((q, i) => {
        if (!passClaimed[i]) {
          let completed = false;
          if (q.type === 'score' && score >= q.target) completed = true;
          else if (q.type === 'record' && highScore > (parseInt(localStorage.getItem('runnerHighScoreOld') || 0))) completed = true;
          else if (q.type === 'skin' && activeSkin && activeSkin.id === q.skin) completed = true;
          else if (q.type === 'character' && currentCharacter.id === q.character) completed = true;
          if (completed) { passClaimed[i] = true; addPassXP(q.xp); saveData(); }
        }
      });
    }

    function checkAchievements() {
      let gotNew = false;
      ACHIEVEMENTS.forEach(a => { if (highScore >= a.req && !claimedAchievements.has(a.id)) { claimedAchievements.add(a.id); if (a.currency === 'crystals') crystals += a.reward; else cryptostals += a.reward; gotNew = true; saveData(); }});
      if (gotNew) {
        playAchievementSound();
        for (let i = 0; i < 30; i++) {
          fireworks.push({ x: Math.random() * CANVAS_WIDTH, y: Math.random() * CANVAS_HEIGHT * 0.5, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 6 - 2, life: 40 + Math.random() * 30, color: ['#ff0', '#f00', '#0f0', '#00f', '#f0f'][Math.floor(Math.random() * 5)] });
        }
      }
    }

    function generateDailyQuests() { const t = [{ desc:'Дойди до 3000', target:3000},{desc:'Дойди до 5000',target:5000},{desc:'Дойди до 8000',target:8000},{desc:'Дойди до 10000',target:10000},{desc:'Дойди до 12000',target:12000},{desc:'Дойди до 15000',target:15000}]; dailyQuests=[]; const u=new Set(); while(dailyQuests.length<4){const q=t[Math.floor(Math.random()*t.length)]; if(!u.has(q.desc)){u.add(q.desc); dailyQuests.push({...q});}} dailyClaimed=[false,false,false,false]; }
    function generateWeeklyQuests() { const t=[{desc:'Дойди до 25000',target:25000},{desc:'Дойди до 35000',target:35000},{desc:'Дойди до 50000',target:50000},{desc:'Побей рекорд',target:'record'},{desc:'Дойди до 75000',target:75000}]; weeklyQuests=[]; const u=new Set(); while(weeklyQuests.length<2){const q=t[Math.floor(Math.random()*t.length)]; if(!u.has(q.desc)){u.add(q.desc); weeklyQuests.push({...q});}} weeklyClaimed=[false,false]; }

    function checkQuestCompletion() { dailyQuests.forEach((q,i)=>{if(!dailyClaimed[i]&&typeof q.target==='number'&&score>=q.target){dailyClaimed[i]=true; crystals+=500; saveData();}}); weeklyQuests.forEach((q,i)=>{if(!weeklyClaimed[i]){if(q.target==='record'&&highScore>(parseInt(localStorage.getItem('runnerHighScoreOld')||0))){weeklyClaimed[i]=true; crystals+=2000; saveData();}else if(typeof q.target==='number'&&score>=q.target){weeklyClaimed[i]=true; crystals+=2000; saveData();}}}); }

    function getObstacleGaps() { if(obstacles.length<2)return[]; let gaps=[]; const s=[...obstacles].sort((a,b)=>a.x-b.x); for(let i=0;i<s.length-1;i++){const gs=s[i].x+s[i].width,ge=s[i+1].x; if(ge-gs>130)gaps.push({start:gs,end:ge});} return gaps; }

      passQuests.forEach((q, i) => { c.innerHTML += `<div class="pass-item"><span>${q.desc} (${q.xp} XP)</span><span>${passClaimed[i] ? '✅' : ''}</span></div>`; });
    }

    function getSkinColor(s) { if(s.chromatic)return'linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet)'; if(s.ultra)return'linear-gradient(135deg,#ff4081,#00e5ff,#ffea00,#ff4081)'; if(s.legendary)return'radial-gradient(circle,#ffff8d,#ffea00)'; if(s.cosmic)return'linear-gradient(45deg,#7c4dff,#00bcd4,#7c4dff)'; if(s.mythic)return'radial-gradient(circle,#ff5252,#b71c1c)'; if(s.roboEyes||s.techGlasses)return'#4fc3f7'; if(s.whiteShirt)return'#ffffff'; return s.color; }

    function handleKeyDown(e) { if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault(); if(menuOpen)closeMenu(); else togglePause();} if(e.key===' '||e.key==='Space'||e.key==='ArrowUp'){e.preventDefault(); attemptJump();} }

    canvas.addEventListener('click', e=>{e.preventDefault(); initAudio(); attemptJump();});
    canvas.addEventListener('touchstart', e=>{e.preventDefault(); initAudio(); attemptJump();});
    pauseButton.addEventListener('click', e=>{e.stopPropagation(); togglePause();});
    inGameMenuBtn.addEventListener('click', e=>{e.stopPropagation(); openMenu();});
    musicToggle.addEventListener('click', e=>{e.stopPropagation(); toggleMusic();});
    window.addEventListener('keydown', handleKeyDown);

    function update() {
      if(gameOver||paused||menuOpen||continueActive)return;
      if(!character.grounded){character.vy+=character.gravity; character.y+=character.vy; if(character.y>=GROUND_Y-CHAR_HEIGHT){character.y=GROUND_Y-CHAR_HEIGHT; character.vy=0; character.grounded=true;}}
      
      let speedMultiplier = 1 + Math.floor(score / 10000) * 0.5;
      if (speedBoostActive) { speedMultiplier *= 1.5; speedBoostTimer--; if (speedBoostTimer <= 0) speedBoostActive = false; }
      currentSpeed = baseSpeed * speedMultiplier;
      
      spawnTimer++; if(spawnTimer>=nextSpawnIn){spawnTimer=0; nextSpawnIn=randomSpawnDelay(); const h=40+Math.random()*25; obstacles.push({x:CANVAS_WIDTH,y:GROUND_Y-h,width:30,height:h});}
      if(score>=40000){birdSpawnTimer++; if(birdSpawnTimer>=140){birdSpawnTimer=0; spawnBird();}}
      crystalSpawnTimer++; 
      if(crystalSpawnTimer > 80) { crystalSpawnTimer = 0; crystalsOnMap.push({ x: CANVAS_WIDTH, y: GROUND_Y - 30 - Math.random() * 100, w: 15, h: 15, collected: false }); }
      
      for(let i=obstacles.length-1;i>=0;i--){obstacles[i].x-=currentSpeed; if(obstacles[i].x<-50)obstacles.splice(i,1);}
      for(let i=birds.length-1;i>=0;i--){birds[i].x-=currentSpeed; if(birds[i].x<-50)birds.splice(i,1);}
      for(let i=crystalsOnMap.length-1;i>=0;i--){crystalsOnMap[i].x-=currentSpeed; if(crystalsOnMap[i].x<-50)crystalsOnMap.splice(i,1);}
      
      for (let i = crystalsOnMap.length - 1; i >= 0; i--) {
        let cr = crystalsOnMap[i];
        if (character.x < cr.x + cr.w && character.x + CHAR_WIDTH > cr.x && character.y < cr.y + cr.h && character.y + CHAR_HEIGHT > cr.y) {
          let amount = 5;
          if (doubleCrystalsActive) amount *= 2;
          crystals += amount;
          stats.crystalsCollected += amount;
          crystalsOnMap.splice(i, 1);
          updateUI();
        }
      }
      if (doubleCrystalsActive) { doubleCrystalsTimer--; if (doubleCrystalsTimer <= 0) doubleCrystalsActive = false; }
      
      score+=Math.floor(currentSpeed*0.7);
      stats.totalScore += Math.floor(currentSpeed*0.7);
      if(score>highScore){highScore=score; saveData(); updateUI(); localStorage.setItem('runnerHighScoreOld',highScore); checkAchievements();}
      checkQuestCompletion(); checkPassQuests();
      Object.values(ALL_SKINS).forEach(s=>{if(s.requirement&&highScore>=s.requirement&&!ownedSkins.has(s.id)){ownedSkins.add(s.id); saveData();}});
      for(let obs of obstacles){if(character.x<obs.x+obs.width&&character.x+CHAR_WIDTH>obs.x&&character.y<obs.y+obs.height&&character.y+CHAR_HEIGHT>obs.y){triggerGameOver(); break;}}
      for(let bird of birds){if(character.x<bird.x+bird.width&&character.x+CHAR_WIDTH>bird.x&&character.y<bird.y+bird.height&&character.y+CHAR_HEIGHT>bird.y){triggerGameOver(); break;}}
      
      for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].x += fireworks[i].vx;
        fireworks[i].y += fireworks[i].vy;
        fireworks[i].vy += 0.1;
        fireworks[i].life--;
        if (fireworks[i].life <= 0) fireworks.splice(i, 1);
      }
    }

    function getTheme() { if(score>=40000)return'space'; if(score>=25000)return'inverted'; return'normal'; }
    function drawSky() { const theme=getTheme(); if(theme==='normal'){ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,CANVAS_WIDTH,GROUND_Y);} else if(theme==='inverted'){ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,CANVAS_WIDTH,GROUND_Y);} else{const grd=ctx.createLinearGradient(0,0,0,GROUND_Y); grd.addColorStop(0,'#0d0d2b'); grd.addColorStop(0.5,'#1a1a4e'); grd.addColorStop(1,'#2d1b69'); ctx.fillStyle=grd; ctx.fillRect(0,0,CANVAS_WIDTH,GROUND_Y); stars.forEach(s=>{const twinkle=Math.sin(Date.now()*0.003+s.twinkle)*0.5+0.5; ctx.fillStyle=`rgba(255,255,255,${0.4+twinkle*0.6})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();});} }
    function drawGround() { const theme=getTheme(); if(theme==='normal'){ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,GROUND_Y,CANVAS_WIDTH,CANVAS_HEIGHT-GROUND_Y); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(CANVAS_WIDTH,GROUND_Y); ctx.stroke();} else if(theme==='inverted'){ctx.fillStyle='#f0f0f0'; ctx.fillRect(0,GROUND_Y,CANVAS_WIDTH,CANVAS_HEIGHT-GROUND_Y); ctx.strokeStyle='#ccc'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(CANVAS_WIDTH,GROUND_Y); ctx.stroke();} else{ctx.fillStyle='#4a148c'; ctx.fillRect(0,GROUND_Y,CANVAS_WIDTH,CANVAS_HEIGHT-GROUND_Y); ctx.strokeStyle='#6a1b9a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(CANVAS_WIDTH,GROUND_Y); ctx.stroke(); ctx.fillStyle='#3a0a6e'; for(let i=0;i<12;i++){const px=(Date.now()*0.02+i*70)%CANVAS_WIDTH; ctx.beginPath(); ctx.ellipse(px,GROUND_Y+15,8,4,0,0,Math.PI*2); ctx.fill();}} }

    function getEffectiveColors() {
      const skin = activeSkin;
      const ch = currentCharacter;
      if (!skin) return { primary: ch.color, secondary: ch.secondary, belly: ch.belly, earInner: ch.earInner };
      return { primary: skin.color, secondary: skin.secondary, belly: skin.belly || '#ffffff', earInner: skin.earInner || '#ffab91' };
    }

    // ==================== ПОЛНЫЕ ФУНКЦИИ ОТРИСОВКИ (БЕЗ СОКРАЩЕНИЙ) ====================

    function drawCharacter() {
      const { x, y, width, height } = character;
      ctx.save();
      const skin = activeSkin;
      const ch = currentCharacter;
      const colors = getEffectiveColors();
      const primaryColor = colors.primary;
      const secondaryColor = colors.secondary;
      const bellyColor = colors.belly;
      const earInner = colors.earInner;
      const isElongated = ch.elongated;
      const isChubby = ch.chubby;

      if (ch.type === 'star') { drawStarShape(x, y, width, height, primaryColor, secondaryColor, skin); }
      else if (ch.type === 'planet') { drawPlanetShape(x, y, width, height, ch, skin, primaryColor, secondaryColor, bellyColor); }
      else if (ch.type === 'humanoid') { drawHumanoidShape(x, y, width, height, ch, skin, primaryColor, secondaryColor, bellyColor); }
      else {
        const bodyWidth = isElongated ? width * 0.32 : (isChubby ? width * 0.44 : width * 0.38);
        const bodyHeight = isElongated ? height * 0.4 : (isChubby ? height * 0.42 : height * 0.35);
        const headSize = isElongated ? width * 0.22 : (isChubby ? width * 0.3 : width * 0.25);
        const earSize = isElongated ? width * 0.06 : (ch.earShape === 'small_round' ? width * 0.07 : width * 0.11);

        let bodyFill = primaryColor;
        if (skin?.chromatic) { const t = Date.now() * 0.002; bodyFill = `rgb(${128 + Math.sin(t) * 127}, ${128 + Math.sin(t + 2) * 127}, ${128 + Math.sin(t + 4) * 127})`; }
        else if (skin?.legendary) { bodyFill = '#ffea00'; ctx.shadowColor = '#ffff8d'; ctx.shadowBlur = 15; }
        else if (skin?.cosmic) { const t = Date.now()*0.002; bodyFill = `rgb(${100+Math.sin(t)*30},${150+Math.sin(t+2)*30},${200+Math.sin(t+4)*30})`; }
        else if (skin?.ultra) { const g = ctx.createLinearGradient(x, y, x+width, y+height); g.addColorStop(0,'#ff4081'); g.addColorStop(0.5,'#00e5ff'); g.addColorStop(1,'#ffea00'); bodyFill = g; }
        else if (skin?.mythic) { const t = Date.now()*0.003; bodyFill = `rgb(${220+Math.sin(t)*35},${40+Math.sin(t+2)*20},${40+Math.sin(t+4)*20})`; }

        if (skin?.whiteShirt) {
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x + width/2, y + height*0.55, bodyWidth, bodyHeight, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#e0e0e0'; ctx.beginPath(); ctx.ellipse(x + width/2, y + height*0.6, bodyWidth*0.6, bodyHeight*0.65, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.moveTo(x + width*0.48, y + height*0.4); ctx.lineTo(x + width*0.55, y + height*0.55); ctx.lineTo(x + width*0.5, y + height*0.4); ctx.fill();
        } else {
          ctx.fillStyle = bodyFill; ctx.beginPath(); ctx.ellipse(x + width/2, y + height*0.55, bodyWidth, bodyHeight, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = bellyColor; ctx.beginPath();
          if (isChubby) ctx.ellipse(x + width/2, y + height*0.6, bodyWidth*0.7, bodyHeight*0.7, 0, 0, Math.PI*2);
          else if (isElongated) ctx.ellipse(x + width/2, y + height*0.6, bodyWidth*0.6, bodyHeight*0.65, 0, 0, Math.PI*2);
          else ctx.ellipse(x + width/2, y + height*0.6, width*0.25, height*0.25, 0, 0, Math.PI*2);
          ctx.fill();
        }

        if (skin?.roboButtons) { ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.arc(x+width*0.35,y+height*0.5,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+width*0.5,y+height*0.55,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+width*0.65,y+height*0.5,3,0,Math.PI*2); ctx.fill(); }
        if (skin?.techSuit) { ctx.strokeStyle='#0288d1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+width*0.2,y+height*0.4); ctx.lineTo(x+width*0.8,y+height*0.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+width*0.2,y+height*0.7); ctx.lineTo(x+width*0.8,y+height*0.7); ctx.stroke(); }

        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        ctx.fillStyle = skin?.whiteShirt ? '#ffffff' : bodyFill;
        ctx.beginPath();
        if (isChubby) ctx.arc(x + width*0.7, y + height*0.25, headSize, 0, Math.PI*2);
        else if (isElongated) ctx.arc(x + width*0.72, y + height*0.28, headSize, 0, Math.PI*2);
        else ctx.arc(x + width*0.7, y + height*0.3, headSize, 0, Math.PI*2);
        ctx.fill();

        if (ch.roboEyes && !skin) { ctx.fillStyle='#00e5ff'; ctx.fillRect(x+width*0.58,y+height*0.22,width*0.08,height*0.05); ctx.fill(); ctx.fillRect(x+width*0.78,y+height*0.22,width*0.08,height*0.05); ctx.fill(); }
        else if (skin?.roboEyes) { ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.rect(x+width*0.58,y+height*0.22,width*0.08,height*0.05); ctx.fill(); ctx.beginPath(); ctx.rect(x+width*0.78,y+height*0.22,width*0.08,height*0.05); ctx.fill(); ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(x+width*0.62,y+height*0.245,width*0.02,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+width*0.82,y+height*0.245,width*0.02,0,Math.PI*2); ctx.fill(); }
        else if (skin?.techGlasses) { ctx.strokeStyle='#4fc3f7'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(x+width*0.55,y+height*0.2,width*0.12,height*0.08,3); ctx.stroke(); ctx.beginPath(); ctx.roundRect(x+width*0.75,y+height*0.2,width*0.12,height*0.08,3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+width*0.67,y+height*0.24); ctx.lineTo(x+width*0.75,y+height*0.24); ctx.stroke(); ctx.fillStyle='#4fc3f7'; ctx.beginPath(); ctx.arc(x+width*0.61,y+height*0.24,width*0.03,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+width*0.81,y+height*0.24,width*0.03,0,Math.PI*2); ctx.fill(); }
        else {
          ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x + width*0.62, y + height*0.26, width*0.07, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x + width*0.82, y + height*0.25, width*0.08, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(x + width*0.63, y + height*0.26, width*0.04, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x + width*0.83, y + height*0.25, width*0.045, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x + width*0.64, y + height*0.24, width*0.02, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x + width*0.84, y + height*0.23, width*0.022, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = primaryColor;
        if (ch.earShape === 'long_ears') {
          ctx.fillStyle = primaryColor;
          ctx.beginPath(); ctx.ellipse(x + width*0.4, y - height*0.1, 6, 18, 0.1, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(x + width*0.7, y - height*0.1, 6, 18, -0.1, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = earInner;
          ctx.beginPath(); ctx.ellipse(x + width*0.4, y - height*0.1, 3, 12, 0.1, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(x + width*0.7, y - height*0.1, 3, 12, -0.1, 0, Math.PI*2); ctx.fill();
        } else if (ch.earShape === 'robotic') {
          ctx.fillStyle = '#455a64';
          ctx.fillRect(x + width*0.2, y + height*0.05, 8, 12);
          ctx.fillRect(x + width*0.55, y + height*0.05, 8, 12);
        } else if (ch.earShape === 'pointy') {
          ctx.beginPath(); ctx.moveTo(x + width*0.48, y + height*0.1); ctx.lineTo(x + width*0.58, y - height*0.05); ctx.lineTo(x + width*0.65, y + height*0.15); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x + width*0.82, y + height*0.08); ctx.lineTo(x + width*0.92, y - height*0.07); ctx.lineTo(x + width*0.98, y + height*0.13); ctx.fill();
        } else if (ch.earShape === 'small_round' || isElongated || isChubby) {
          ctx.beginPath(); ctx.arc(x + width*0.58, y + height*0.14, earSize, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(x + width*0.88, y + height*0.12, earSize, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = earInner; ctx.beginPath(); ctx.arc(x + width*0.58, y + height*0.14, earSize*0.6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(x + width*0.88, y + height*0.12, earSize*0.6, 0, Math.PI*2); ctx.fill();
        }

        if (ch.pointyNose) {
          ctx.fillStyle = '#333';
          ctx.beginPath(); ctx.moveTo(x + width*0.95, y + height*0.33); ctx.lineTo(x + width + 5, y + height*0.35); ctx.lineTo(x + width*0.95, y + height*0.37); ctx.fill();
        }

        if (!skin?.roboEyes && !skin?.techGlasses && !ch.roboEyes) {
          ctx.fillStyle = bellyColor;
          ctx.beginPath(); ctx.ellipse(x + width*0.8, y + height*0.36, width*0.13, height*0.08, 0, 0, Math.PI*2); ctx.fill();
          if (ch.hasTeeth && !skin) { ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(x+width*0.72,y+height*0.38); ctx.lineTo(x+width*0.76,y+height*0.44); ctx.lineTo(x+width*0.78,y+height*0.38); ctx.fill(); ctx.beginPath(); ctx.moveTo(x+width*0.82,y+height*0.38); ctx.lineTo(x+width*0.86,y+height*0.44); ctx.lineTo(x+width*0.88,y+height*0.38); ctx.fill(); }
          ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(x + width*0.78, y + height*0.33, width*0.04, 0, Math.PI*2); ctx.fill();
        }

        if (ch.metalBody && !skin) {
          ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x + width*0.3, y + height*0.4); ctx.lineTo(x + width*0.7, y + height*0.4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x + width*0.3, y + height*0.6); ctx.lineTo(x + width*0.7, y + height*0.6); ctx.stroke();
        }

        ctx.fillStyle = secondaryColor;
        if (character.grounded && !paused && !gameOver) { let ls=Math.sin(Date.now()*0.02)*3; ctx.beginPath(); ctx.ellipse(x+width*0.2,y+height*0.85+ls,width*0.08,height*0.1,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+width*0.5,y+height*0.85-ls,width*0.08,height*0.1,0,0,Math.PI*2); ctx.fill(); }
        else { ctx.beginPath(); ctx.ellipse(x+width*0.2,y+height*0.85,width*0.08,height*0.1,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+width*0.5,y+height*0.85,width*0.08,height*0.1,0,0,Math.PI*2); ctx.fill(); }

        ctx.strokeStyle = primaryColor; ctx.lineWidth = isChubby ? 4 : (isElongated ? 2 : 3);
        if (ch.tailType === 'bushy') {
          ctx.fillStyle = primaryColor;
          ctx.beginPath(); ctx.moveTo(x + width*0.05, y + height*0.7);
          ctx.quadraticCurveTo(x - width*0.3, y + height*0.5, x - width*0.25, y + height*0.3);
          ctx.quadraticCurveTo(x - width*0.15, y + height*0.2, x + width*0.05, y + height*0.5);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(x - width*0.2, y + height*0.3, 6, 0, Math.PI*2); ctx.fill();
        } else if (ch.tailType === 'tiny') { ctx.beginPath(); ctx.moveTo(x+width*0.05,y+height*0.8); ctx.quadraticCurveTo(x-width*0.05,y+height*0.78,x-width*0.03,y+height*0.72); ctx.stroke(); }
        else if (ch.tailType === 'short_thick') { ctx.beginPath(); ctx.moveTo(x+width*0.05,y+height*0.78); ctx.quadraticCurveTo(x-width*0.1,y+height*0.75,x-width*0.08,y+height*0.65); ctx.stroke(); }
        else if (ch.tailType === 'long') { ctx.beginPath(); ctx.moveTo(x+width*0.1,y+height*0.75); ctx.quadraticCurveTo(x-width*0.2,y+height*0.65,x-width*0.12,y+height*0.45); ctx.stroke(); }
        else if (ch.tailType === 'curly') { ctx.beginPath(); ctx.moveTo(x+width*0.1,y+height*0.75); ctx.quadraticCurveTo(x-width*0.15,y+height*0.6,x-width*0.05,y+height*0.5); ctx.stroke(); }
        else if (ch.tailType === 'waggy') { const wag=Math.sin(Date.now()*0.03)*5; ctx.beginPath(); ctx.moveTo(x+width*0.1,y+height*0.75); ctx.quadraticCurveTo(x-width*0.2,y+height*0.6,x-width*0.2+wag,y+height*0.4); ctx.stroke(); }
        else if (ch.tailType === 'short') { ctx.beginPath(); ctx.moveTo(x+width*0.1,y+height*0.75); ctx.quadraticCurveTo(x-width*0.08,y+height*0.7,x-width*0.05,y+height*0.6); ctx.stroke(); }
      }
      ctx.restore();
    }

    function drawStarShape(x, y, width, height, primaryColor, secondaryColor, skin) {
      const cx = x + width/2, cy = y + height/2;
      const spikes = 8, outerRadius = width * 0.4, innerRadius = width * 0.2;
      ctx.fillStyle = primaryColor; if (skin?.cosmic) { const t = Date.now() * 0.002; ctx.fillStyle = `rgb(${100+Math.sin(t)*30},${150+Math.sin(t+2)*30},${200+Math.sin(t+4)*30})`; }
      ctx.shadowColor = secondaryColor; ctx.shadowBlur = 20;
      ctx.beginPath(); for (let i = 0; i < spikes * 2; i++) { const radius = i % 2 === 0 ? outerRadius : innerRadius; const angle = (i * Math.PI) / spikes - Math.PI / 2; const sx = cx + Math.cos(angle) * radius, sy = cy + Math.sin(angle) * radius; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(cx - 5, cy - 5, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 8, cy - 5, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(cx - 4, cy - 5, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 9, cy - 5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx + 2, cy + 5, 6, 0, Math.PI); ctx.stroke();
    }

    function drawPlanetShape(x, y, width, height, ch, skin, primaryColor, secondaryColor, bellyColor) {
      const cx = x + width/2, cy = y + height/2, radius = width * 0.4;
      ctx.fillStyle = primaryColor; if (skin?.cosmic) { const t = Date.now() * 0.002; ctx.fillStyle = `rgb(${100+Math.sin(t)*30},${150+Math.sin(t+2)*30},${200+Math.sin(t+4)*30})`; }
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
      if (!skin) {
        if (ch.earthColors) { ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(cx - 5, cy - 3, 8, 5, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + 6, cy + 4, 7, 4, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx - 8, cy + 6, 5, 3, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(cx + 2, cy - 8, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); }
        if (ch.moonCraters) { ctx.fillStyle = '#757575'; ctx.beginPath(); ctx.arc(cx - 6, cy - 4, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 8, cy + 2, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx - 2, cy + 8, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 5, cy - 7, 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#9e9e9e'; ctx.beginPath(); ctx.arc(cx - 6, cy - 4, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 8, cy + 2, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx - 2, cy + 8, 2.5, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(cx - 7, cy - 3, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 7, cy - 3, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(cx - 6, cy - 3, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 8, cy - 3, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy + 3, 5, 0.1, Math.PI - 0.1); ctx.stroke();
    }

    function drawHumanoidShape(x, y, width, height, ch, skin, primaryColor, secondaryColor, bellyColor) {
      ctx.fillStyle = primaryColor; if (skin?.chromatic) { const t = Date.now() * 0.002; ctx.fillStyle = `rgb(${128 + Math.sin(t) * 127}, ${128 + Math.sin(t + 2) * 127}, ${128 + Math.sin(t + 4) * 127})`; }
      ctx.beginPath(); ctx.roundRect(x + width*0.2, y + height*0.35, width*0.6, height*0.45, 8); ctx.fill();
      ctx.fillStyle = secondaryColor; ctx.beginPath(); ctx.roundRect(x + width*0.25, y + height*0.5, width*0.5, height*0.3, 5); ctx.fill();
      if (!skin || skin?.chromatic) { ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(x + width*0.5, y + height*0.45, 6, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; for (let i = 0; i < 8; i++) { const angle = (i * Math.PI * 2) / 8; ctx.beginPath(); ctx.moveTo(x + width*0.5, y + height*0.45); ctx.lineTo(x + width*0.5 + Math.cos(angle) * 8, y + height*0.45 + Math.sin(angle) * 8); ctx.stroke(); } }
      ctx.fillStyle = primaryColor; if (skin?.chromatic) { const t = Date.now() * 0.002; ctx.fillStyle = `rgb(${128 + Math.sin(t) * 127}, ${128 + Math.sin(t + 2) * 127}, ${128 + Math.sin(t + 4) * 127})`; }
      ctx.beginPath(); ctx.arc(x + width*0.5, y + height*0.25, width*0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'white'; ctx.beginPath(); ctx.ellipse(x + width*0.4, y + height*0.23, 6, 8, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + width*0.6, y + height*0.23, 6, 8, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x + width*0.4, y + height*0.23, 6, 8, -0.2, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x + width*0.6, y + height*0.23, 6, 8, 0.2, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = primaryColor; if (skin?.chromatic) { const t = Date.now() * 0.002; ctx.fillStyle = `rgb(${128 + Math.sin(t) * 127}, ${128 + Math.sin(t + 2) * 127}, ${128 + Math.sin(t + 4) * 127})`; }
      if (character.grounded && !paused && !gameOver) { let ls = Math.sin(Date.now() * 0.02) * 3; ctx.beginPath(); ctx.roundRect(x + width*0.22, y + height*0.78 + ls, width*0.12, height*0.1, 3); ctx.fill(); ctx.beginPath(); ctx.roundRect(x + width*0.5, y + height*0.78 - ls, width*0.12, height*0.1, 3); ctx.fill(); }
      else { ctx.beginPath(); ctx.roundRect(x + width*0.22, y + height*0.78, width*0.12, height*0.1, 3); ctx.fill(); ctx.beginPath(); ctx.roundRect(x + width*0.5, y + height*0.78, width*0.12, height*0.1, 3); ctx.fill(); }
    }

    function drawObstacles() { obstacles.forEach(o=>{ctx.save(); ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.roundRect(o.x,o.y,o.width,o.height,6); ctx.fill(); ctx.fillStyle='#4caf50'; ctx.beginPath(); ctx.roundRect(o.x+4,o.y+2,o.width-8,o.height-4,4); ctx.fill(); ctx.fillStyle='#1b5e20'; for(let i=0;i<o.height/12;i++){const sy=o.y+8+i*12; if(sy>o.y+o.height-8)break; ctx.beginPath(); ctx.moveTo(o.x-3,sy); ctx.lineTo(o.x+3,sy-2); ctx.lineTo(o.x+3,sy+2); ctx.fill(); ctx.beginPath(); ctx.moveTo(o.x+o.width+3,sy); ctx.lineTo(o.x+o.width-3,sy-2); ctx.lineTo(o.x+o.width-3,sy+2); ctx.fill();} ctx.fillStyle='#81c784'; ctx.beginPath(); ctx.arc(o.x+o.width/2,o.y+4,5,0,Math.PI*2); ctx.fill(); ctx.restore();}); }
    function drawBirds() { birds.forEach(b=>{ctx.save(); const wf=Math.sin(Date.now()*0.025)*4; ctx.shadowColor='#7c4dff'; ctx.shadowBlur=12; const bg=ctx.createLinearGradient(b.x,b.y,b.x+b.width,b.y+b.height); bg.addColorStop(0,'#1a237e'); bg.addColorStop(0.3,'#4a148c'); bg.addColorStop(0.6,'#7c4dff'); bg.addColorStop(1,'#00bcd4'); ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(b.x+b.width/2,b.y+b.height/2,b.width/3,b.height/3.5,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffffff'; for(let i=0;i<5;i++){const sx=b.x+b.width/2-b.width/4+Math.random()*b.width/2; const sy=b.y+b.height/2-b.height/4+Math.random()*b.height/2; ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();} ctx.shadowBlur=0; ctx.restore();}); }

    function draw() { 
      ctx.clearRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT); drawSky(); drawGround(); 
      crystalsOnMap.forEach(cr => { ctx.fillStyle = '#00BCD4'; ctx.fillRect(cr.x, cr.y, cr.w, cr.h); ctx.fillStyle = '#fff'; ctx.fillRect(cr.x + 3, cr.y + 2, 4, 4); });
      drawObstacles(); drawBirds(); drawCharacter(); 
      fireworks.forEach(f => { ctx.fillStyle = f.color; ctx.globalAlpha = f.life / 70; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;
      ctx.fillStyle=score>=25000?'#ffffff':'#212121'; ctx.font='bold 20px "Courier New"'; ctx.fillText(currentCharacter.name+': '+score,20,45); 
      if (speedBoostActive) { ctx.fillStyle = '#ff9800'; ctx.fillText('⚡ БУСТ', CANVAS_WIDTH - 100, 45); }
      if (doubleCrystalsActive) { ctx.fillStyle = '#80d8ff'; ctx.fillText('💎 x2', CANVAS_WIDTH - 100, 65); }
      if(gameOver&&!continueActive){ctx.globalAlpha=0.8; ctx.fillStyle='#212121'; ctx.font='bold 36px "Courier New"'; ctx.textAlign='center'; ctx.fillText('💀 КОНЕЦ ИГРЫ',CANVAS_WIDTH/2,CANVAS_HEIGHT/2); ctx.textAlign='left'; ctx.globalAlpha=1;}
    }

    if (!ctx.roundRect) { ctx.roundRect = function(x,y,w,h,r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }; }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

    function resetDailyQuestIfNeeded() { const today=new Date().toDateString(); if(lastDailyReset!==today){dailyClaimed=[false,false,false,false]; lastDailyReset=today; generateDailyQuests(); saveData();}}
    function resetWeeklyQuestIfNeeded() { const now=new Date(); if(now.getDay()===0){const today=now.toDateString(); if(lastWeeklyReset!==today){weeklyClaimed=[false,false]; lastWeeklyReset=today; generateWeeklyQuests(); saveData();}}}

    function init() {
      loadData();
      resetDailyQuestIfNeeded(); resetWeeklyQuestIfNeeded(); resetPassIfNeeded();
      if(!dailyQuests.length)generateDailyQuests();
      if(!weeklyQuests.length)generateWeeklyQuests();
      if(!passQuests.length)generatePassQuests();
      updateUI(); resetGame(); gameLoop();
    }

    init();
    setInterval(saveData, 3000);
  })();
</script>
