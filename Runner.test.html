<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
  <title>Раннер • Firebase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation; user-select: none;
    }
    .game-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .game-container {
      position: relative; background-color: #f7f7f7; border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; width: 100%; max-width: 800px;
    }
    canvas { display: block; width: 100%; height: auto; background-color: #fff; cursor: pointer; }
    .record-panel {
      position: absolute; top: 12px; right: 20px; background: rgba(0,0,0,0.7);
      color: #fdd835; padding: 8px 18px; border-radius: 40px; font-weight: bold; font-size: 1.2rem;
      z-index: 10; pointer-events: none;
    }
    .music-toggle, .pause-button {
      position: absolute; top: 12px; background: rgba(0,0,0,0.7); color: white;
      border-radius: 40px; padding: 8px 14px; font-weight: bold; font-size: 1.1rem; cursor: pointer; z-index: 20;
      font-family: 'Courier New', monospace; border: 1px solid rgba(255,255,255,0.25);
    }
    .music-toggle { left: 20px; }
    .pause-button { left: 50%; transform: translateX(-50%); }
    .restart-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ddd; padding: 6px 18px; border-radius: 20px;
      font-size: 0.9rem; z-index: 10; pointer-events: none; display: none;
    }
    .continue-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 25; display: none;
    }
    .continue-panel {
      background: #1e1e2e; border: 2px solid #fdd835; border-radius: 20px;
      padding: 20px 30px; text-align: center; color: white;
    }
    .continue-panel h3 { color: #fdd835; margin-bottom: 10px; }
    .timer { font-size: 2rem; color: #ff5252; font-weight: bold; margin: 15px 0; }
    .continue-buttons { display: flex; gap: 15px; justify-content: center; }
    .continue-btn, .decline-btn { padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; border: none; color: white; }
    .continue-btn { background: #4caf50; }
    .decline-btn { background: #f44336; }
    .in-game-menu-btn {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fdd835; border-radius: 40px; padding: 8px 18px;
      font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 20; display: none;
      font-family: 'Courier New', monospace; border: 1px solid rgba(255,255,255,0.25);
    }
    .menu-overlay, .auth-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center;
      align-items: center; z-index: 30; border-radius: 24px;
    }
    .auth-overlay { z-index: 40; background: rgba(0,0,0,0.95); }
    .menu-panel, .auth-panel {
      background: #1e1e2e; border: 2px solid #555; border-radius: 24px; padding: 20px;
      width: 90%; max-width: 600px; color: white; text-align: center;
      max-height: 80vh; overflow-y: auto;
    }
    .auth-panel { max-width: 400px; border-color: #fdd835; }
    .menu-panel h2, .auth-panel h2 { margin-bottom: 15px; font-size: 1.8rem; color: #fdd835; }
    .currencies-menu { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; font-weight: bold; }
    .crystals { color: #80d8ff; }
    .cryptostals { color: #ff80ab; }
    .menu-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .menu-tab { background: #333; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.8rem; }
    .menu-tab.active { background: #fdd835; color: #222; }
    .menu-content { text-align: left; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: #333; border-radius: 16px; padding: 10px; cursor: pointer; border: 2px solid transparent; text-align: center; }
    .card.selected { border-color: #fdd835; }
    .card:hover { background: #444; }
    .preview { width: 50px; height: 50px; margin: 0 auto 6px; border-radius: 10px; }
    .card-name { font-weight: bold; font-size: 0.8rem; }
    .card-price { font-size: 0.7rem; margin-top: 3px; }
    .card-price.crystals { color: #80d8ff; }
    .card-price.cryptostals { color: #ff80ab; }
    .btn { background: #fdd835; color: #222; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; }
    .close-btn { margin-top: 20px; }
    .auth-input, .promo-input {
      background: #333; border: 2px solid #555; color: white; padding: 12px;
      border-radius: 12px; font-size: 1.1rem; text-align: center; font-family: 'Courier New', monospace;
      width: 100%; margin: 8px 0;
    }
    .auth-input:focus, .promo-input:focus { outline: none; border-color: #fdd835; }
    .auth-label { display: block; text-align: left; margin-top: 10px; color: #aaa; font-size: 0.9rem; }
    .auth-message, .promo-message { margin: 10px 0; padding: 10px; border-radius: 12px; font-weight: bold; display: none; }
    .auth-message.error, .promo-message.error { background: #b71c1c; color: #ef9a9a; display: block; }
    .auth-message.success, .promo-message.success { background: #1b5e20; color: #81c784; display: block; }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.75rem; }
    .leaderboard-table th { background: #333; padding: 8px; text-align: left; }
    .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; }
    .quest-item { background: #2a2a3a; padding: 8px 12px; border-radius: 8px; margin: 4px 0; font-size: 0.8rem; }
    .pass-progress { background: #444; border-radius: 10px; height: 10px; margin: 5px 0; overflow: hidden; }
    .pass-fill { background: #fdd835; height: 100%; transition: width 0.3s; }
    .pass-timer { font-size: 0.7rem; color: #aaa; margin: 5px 0; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button class="music-toggle" id="musicToggle">🔊</button>
    <div class="record-panel">🏆 <span id="recordDisplay">0</span></div>
    <button class="pause-button" id="pauseButton">⏸️ Пауза</button>
    <button class="in-game-menu-btn" id="inGameMenuBtn">🏠 Меню</button>
    <div class="restart-hint" id="restartHint">🔄 Коснитесь / Пробел для рестарта</div>
    <div class="continue-overlay" id="continueOverlay">
      <div class="continue-panel">
        <h3>💀 Вы проиграли!</h3>
        <p>Продолжить за 💎100?</p>
        <div class="timer" id="continueTimer">8</div>
        <div class="continue-buttons">
          <button class="continue-btn" id="continueYes">✅ Да</button>
          <button class="decline-btn" id="continueNo">❌ Нет</button>
        </div>
      </div>
    </div>
    <div class="auth-overlay" id="authOverlay" style="display:flex;">
      <div class="auth-panel" id="authPanel"></div>
    </div>
    <div class="menu-overlay" id="menuOverlay" style="display:none;">
      <div class="menu-panel" id="menuPanel"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzSkne1P83HnZuDLboLBBHC2dK1RDiuhM",
    authDomain: "runnerr-20f52.firebaseapp.com",
    databaseURL: "https://runnerr-20f52-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "runnerr-20f52",
    storageBucket: "runnerr-20f52.firebasestorage.app",
    messagingSenderId: "133710015550",
    appId: "1:133710015550:web:bcbf049afd31578a74b56f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  function waitForDOM() {
    return new Promise((resolve) => {
      if (document.readyState === 'complete' || document.readyState === 'interactive') resolve();
      else document.addEventListener('DOMContentLoaded', resolve);
    });
  }

  async function initApp() {
    await waitForDOM();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const recordDisplay = document.getElementById('recordDisplay');
    const restartHint = document.getElementById('restartHint');
    const pauseButton = document.getElementById('pauseButton');
    const inGameMenuBtn = document.getElementById('inGameMenuBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuPanel = document.getElementById('menuPanel');
    const musicToggle = document.getElementById('musicToggle');
    const continueOverlay = document.getElementById('continueOverlay');
    const continueTimer = document.getElementById('continueTimer');
    const continueYes = document.getElementById('continueYes');
    const continueNo = document.getElementById('continueNo');
    const authOverlay = document.getElementById('authOverlay');
    const authPanel = document.getElementById('authPanel');

    canvas.addEventListener('mousedown', function(e) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') e.stopPropagation();
    });

    const CANVAS_WIDTH = 800, CANVAS_HEIGHT = 400, GROUND_Y = 320;
    let gameOver = false, paused = false, menuOpen = false, continueActive = false;
    let continueSeconds = 8, continueInterval = null;
    let score = 0, highScore = 0, crystals = 0, cryptostals = 0;
    let passXP = 0, passLevel = 1, lastPassReset = '';
    let stats = { jumps: 0, deaths: 0, crystalsCollected: 0, totalScore: 0 };
    let baseSpeed = 6.5, currentSpeed = baseSpeed;
    let spawnTimer = 0, nextSpawnIn = 70;
    let obstacles = [], birds = [], crystalsOnMap = [], fireworks = [];
    let audioCtx = null, musicPlaying = false;
    let lootboxReady = false, lastLootboxDay = '';
    let speedBoostActive = false, speedBoostTimer = 0;
    let doubleCrystalsActive = false, doubleCrystalsTimer = 0;
    let gameLoopId = null;
    let character = { x: 120, y: GROUND_Y - 54, width: 44, height: 54, vy: 0, gravity: 0.8, grounded: true };
    let stars = [];
    for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * CANVAS_WIDTH, y: Math.random() * GROUND_Y * 0.7, size: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2 });

    let playerId = localStorage.getItem('runnerPlayerId');
    let codeWord = localStorage.getItem('runnerCodeWord');
    let isAuthenticated = false;

    function generatePlayerId() { return 'RNR-' + Math.random().toString(36).substring(2, 8).toUpperCase(); }
    function generateCodeWord() {
      const words = ['Fire','Star','Moon','Wind','Wolf','Bear','Fox','Lion','Eagle','Hawk','Jade','Ruby','Gold','Iron','Steel','Storm','Frost','Blaze','Shadow','Light'];
      return words[Math.floor(Math.random()*words.length)] + Math.floor(Math.random()*1000);
    }

    function verifyLogin(id, word, callback) {
      get(ref(db, 'accounts/' + id)).then(s => { callback(s.exists() && s.val().codeWord === word); }).catch(() => callback(false));
    }

    function showAuth() {
      authOverlay.style.display = 'flex';
      if (playerId && codeWord) {
        verifyLogin(playerId, codeWord, success => {
          if (success) { authOverlay.style.display = 'none'; isAuthenticated = true; loadGameData(); loadFriends(); startGame(); }
          else renderAuthScreen('main');
        });
      } else renderAuthScreen('main');
    }

    function renderAuthScreen(screen) {
      authOverlay.style.display = 'flex';
      if (screen === 'main') {
        authPanel.innerHTML = `
          <h2>🎮 Раннер</h2>
          <p style="color:#aaa;margin-bottom:20px;">Добро пожаловать!</p>
          <button class="btn" id="btnRegister" style="width:100%;margin:10px 0;padding:15px;">📝 Регистрация</button>
          <button class="btn" id="btnLogin" style="width:100%;margin:10px 0;padding:15px;background:#2196f3;color:white;">🔑 Вход</button>
          <button class="btn" id="btnPlayLocal" style="width:100%;margin:10px 0;padding:15px;background:#666;color:white;">💾 Играть локально</button>
        `;
        setTimeout(() => {
          document.getElementById('btnRegister').addEventListener('click', () => renderAuthScreen('register'));
          document.getElementById('btnLogin').addEventListener('click', () => renderAuthScreen('login'));
          document.getElementById('btnPlayLocal').addEventListener('click', () => {
            playerId = 'local_' + Date.now().toString(36); codeWord = 'local';
            authOverlay.style.display = 'none'; isAuthenticated = true;
            loadFromLocal(); startGame();
          });
        }, 100);
      } else if (screen === 'register') {
        const newId = generatePlayerId(); const newWord = generateCodeWord();
        authPanel.innerHTML = `
          <h2>📝 Регистрация</h2>
          <div style="background:#1b5e20;padding:15px;border-radius:12px;margin:15px 0;text-align:left;">
            <p><strong>ID:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newId}</span></p>
            <p><strong>Код:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newWord}</span></p>
            <p style="color:#ff9800;font-size:0.8rem;margin-top:10px;">⚠️ Сохраните!</p>
          </div>
          <button class="btn" id="btnConfirmRegister" style="width:100%;padding:15px;">✅ Я сохранил</button>
          <button class="btn" id="btnBack" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
        `;
        setTimeout(() => {
          document.getElementById('btnConfirmRegister').addEventListener('click', () => {
            set(ref(db, 'accounts/' + newId), { codeWord: newWord, createdAt: Date.now() }).then(() => {
              playerId = newId; codeWord = newWord;
              localStorage.setItem('runnerPlayerId', playerId); localStorage.setItem('runnerCodeWord', codeWord);
              authOverlay.style.display = 'none'; isAuthenticated = true;
              loadGameData(); loadFriends(); startGame();
            });
          });
          document.getElementById('btnBack').addEventListener('click', () => renderAuthScreen('main'));
        }, 100);
      } else if (screen === 'login') {
        authPanel.innerHTML = `
          <h2>🔑 Вход</h2>
          <label class="auth-label">ID:</label>
          <input type="text" class="auth-input" id="loginId" placeholder="RNR-XXXXXX" autocomplete="off">
          <label class="auth-label">Кодовое слово:</label>
          <input type="text" class="auth-input" id="loginWord" placeholder="Кодовое слово" autocomplete="off">
          <div class="auth-message" id="authMessage"></div>
          <button class="btn" id="btnConfirmLogin" style="width:100%;padding:15px;margin-top:10px;">Войти</button>
          <button class="btn" id="btnBack2" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
        `;
        setTimeout(() => {
          const inp1 = document.getElementById('loginId'); const inp2 = document.getElementById('loginWord');
          [inp1, inp2].forEach(i => { i.addEventListener('mousedown', e => e.stopPropagation()); i.addEventListener('touchstart', e => e.stopPropagation()); });
          document.getElementById('btnConfirmLogin').addEventListener('click', () => {
            const id = inp1.value.trim(); const word = inp2.value.trim();
            if (!id || !word) { document.getElementById('authMessage').className = 'auth-message error'; document.getElementById('authMessage').textContent = 'Заполните все поля!'; return; }
            verifyLogin(id, word, success => {
              if (success) {
                playerId = id; codeWord = word;
                localStorage.setItem('runnerPlayerId', playerId); localStorage.setItem('runnerCodeWord', codeWord);
                authOverlay.style.display = 'none'; isAuthenticated = true;
                loadGameData(); loadFriends(); startGame();
              } else { document.getElementById('authMessage').className = 'auth-message error'; document.getElementById('authMessage').textContent = 'Неверный ID или кодовое слово!'; }
            });
          });
          document.getElementById('btnBack2').addEventListener('click', () => renderAuthScreen('main'));
          setTimeout(() => inp1.focus(), 200);
        }, 100);
      }
    }

    // ============ ВСЕ ПЕРСОНАЖИ ============
    const CHARACTERS = {
      LEO: { id: 'leo', name: 'Лео', type: 'animal', color: '#ff9800', secondary: '#e65100', belly: '#ffcc80', earInner: '#ffab91', earShape: 'round', tailType: 'long', hasMane: true },
      DINO: { id: 'dino', name: 'Дино', type: 'animal', color: '#4caf50', secondary: '#2e7d32', belly: '#a5d6a7', earInner: '#81c784', earShape: 'spikes', tailType: 'short', hasSpikes: true },
      CAT: { id: 'cat', name: 'Котик', type: 'animal', color: '#9e9e9e', secondary: '#616161', belly: '#e0e0e0', earInner: '#f48fb1', earShape: 'pointy', tailType: 'curly', hasWhiskers: true },
      DOG: { id: 'dog', name: 'Собачка', type: 'animal', color: '#8d6e63', secondary: '#5d4037', belly: '#d7ccc8', earInner: '#bcaaa4', earShape: 'floppy', tailType: 'waggy', hasTongue: true },
      PANTHER: { id: 'panther', name: 'Пантера', type: 'animal', color: '#1a1a1a', secondary: '#333', belly: '#2a2a2a', earInner: '#444', earShape: 'small_round', tailType: 'short_thick', hasTeeth: true, elongated: true },
      BEAR: { id: 'bear', name: 'Медвежонок', type: 'animal', color: '#8d6e63', secondary: '#5d4037', belly: '#d7ccc8', earInner: '#bcaaa4', earShape: 'small_round', tailType: 'tiny', chubby: true },
      FOX: { id: 'fox', name: 'Лис', type: 'animal', color: '#ff6d00', secondary: '#e65100', belly: '#ffcc80', earInner: '#fff', earShape: 'pointy', tailType: 'bushy', pointyNose: true },
      RABBIT: { id: 'rabbit', name: 'Кролик', type: 'animal', color: '#f5f5f5', secondary: '#e0e0e0', belly: '#fff', earInner: '#ff80ab', earShape: 'long_ears', tailType: 'tiny', jumpBonus: true },
      CYBORG: { id: 'cyborg', name: 'Киборг', type: 'animal', color: '#607d8b', secondary: '#455a64', belly: '#90a4ae', earInner: '#78909c', earShape: 'robotic', tailType: 'short', roboEyes: true, metalBody: true },
      SPIDERMAN: { id: 'spiderman', name: 'Человек-паук', type: 'humanoid', price: 5000, color: '#c62828', secondary: '#1565c0', belly: '#2196f3', earInner: '#c62828', spiderEmblem: true },
      SUN: { id: 'sun', name: 'Солнце', type: 'star', price: 7000, color: '#ffd600', secondary: '#ff8f00', belly: '#ffea00' },
      EARTH: { id: 'earth', name: 'Земля', type: 'planet', price: 3000, color: '#2196f3', secondary: '#4caf50', belly: '#fff', earthColors: true },
      MOON: { id: 'moon', name: 'Луна', type: 'planet', price: 2500, color: '#9e9e9e', secondary: '#757575', belly: '#bdbdbd', moonCraters: true }
    };
    let currentCharacter = CHARACTERS.LEO;
    let ownedCharacters = new Set(['leo','dino','cat','dog','panther','bear','fox','rabbit','cyborg']);

    // ============ ВСЕ СКИНЫ ============
    const ALL_SKINS = {
      CLASSIC: { id: 'classic', name: 'Классический', color: null },
      GOLDEN: { id: 'golden', name: 'Золотой', price: 1500, color: '#ffd700', secondary: '#b8860b', belly: '#fff176', earInner: '#ffec80', currency: 'crystals' },
      RARE: { id: 'rare', name: 'Сверхредкий', price: 2000, color: '#2196f3', secondary: '#0d47a1', belly: '#90caf9', earInner: '#64b5f6', currency: 'crystals' },
      EPIC: { id: 'epic', name: 'Эпический', price: 3000, color: '#9c27b0', secondary: '#6a1b9a', belly: '#ce93d8', earInner: '#e1bee7', currency: 'crystals' },
      MYTHIC: { id: 'mythic', name: 'Мифический', price: 5000, color: '#f44336', secondary: '#b71c1c', belly: '#ef9a9a', earInner: '#ffcdd2', currency: 'crystals' },
      LEGENDARY: { id: 'legendary', name: 'Легендарный', price: 7000, color: '#ffea00', secondary: '#ffab00', belly: '#fff9c4', earInner: '#ffff8d', currency: 'crystals' },
      CHROMATIC: { id: 'chromatic', name: 'Хроматический', price: 15000, color: '#ff4081', secondary: '#00e5ff', belly: '#fff', earInner: '#fff', chromatic: true, currency: 'crystals' },
      ULTRA: { id: 'ultra', name: 'Ультралегендарный', price: 20000, color: '#ff4081', secondary: '#00e5ff', belly: '#ff80ab', earInner: '#f8bbd0', ultra: true, currency: 'cryptostals' },
      FLAME: { id: 'flame', name: 'Пламенный', price: 5000, color: '#ff6d00', secondary: '#d50000', belly: '#ffab40', earInner: '#ff5252', flame: true, currency: 'cryptostals' },
      NEON: { id: 'neon', name: 'Неоновый', price: 8000, color: '#00ff88', secondary: '#00cc66', belly: '#ccffcc', earInner: '#66ff99', neon: true, currency: 'cryptostals' }
    };
    let activeSkin = null;
    let ownedSkins = new Set();

    const PROMOCODES = {
      'GOLDEN2026': { reward: { type: 'skin', skinId: 'golden' }, oneTime: true },
      'KOSMOMAY': { reward: { type: 'skin', skinId: 'cosmic' } },
      'KRIPT2026': { reward: { type: 'cryptostals', amount: 5000 }, oneTime: true },
      'KRISTMAY': { reward: { type: 'crystals', amount: 12000 }, oneTime: true },
      'FAILPRISE': { reward: { type: 'combo', skinId: 'flame', crystals: 3000 }, oneTime: true },
      'NEONLIFE': { reward: { type: 'skin', skinId: 'neon' }, oneTime: true }
    };
    let usedPromocodes = new Set();

    let dailyQuests = [], dailyClaimed = [false,false,false,false], lastDailyReset = '';
    let weeklyQuests = [], weeklyClaimed = [false,false], lastWeeklyReset = '';
    let passQuests = [], passClaimed = [];
    const PASS_XP = 400, PASS_RESET = 4;
    let friends = [];

    function saveToCloud() {
      if (!isAuthenticated || !playerId || playerId.startsWith('local_')) return;
      const data = { codeWord, highScore, crystals, cryptostals, passXP, passLevel, character: currentCharacter.id, activeSkin: activeSkin?.id||'', ownedSkins: [...ownedSkins], ownedCharacters: [...ownedCharacters], usedPromocodes: [...usedPromocodes], stats, lastLootboxDay, lastUpdated: Date.now() };
      set(ref(db, 'accounts/' + playerId), data).catch(() => {});
    }

    function loadGameData() {
      if (!isAuthenticated || !playerId || playerId.startsWith('local_')) return;
      get(ref(db, 'accounts/' + playerId)).then(s => {
        if (s.exists()) {
          const d = s.val();
          highScore = d.highScore||0; crystals = d.crystals||0; cryptostals = d.cryptostals||0;
          passXP = d.passXP||0; passLevel = d.passLevel||1;
          currentCharacter = Object.values(CHARACTERS).find(c=>c.id===d.character) || CHARACTERS.LEO;
          activeSkin = d.activeSkin ? (ALL_SKINS[d.activeSkin.toUpperCase()]||null) : null;
          ownedSkins = new Set(d.ownedSkins||[]);
          ownedCharacters = new Set(d.ownedCharacters||['leo','dino','cat','dog','panther','bear','fox','rabbit','cyborg']);
          usedPromocodes = new Set(d.usedPromocodes||[]);
          stats = d.stats||{jumps:0,deaths:0,crystalsCollected:0,totalScore:0};
          lastLootboxDay = d.lastLootboxDay||''; lootboxReady = lastLootboxDay !== new Date().toDateString();
        }
      });
    }

    function submitScore() { if (isAuthenticated && playerId && highScore>0) push(ref(db, 'leaderboard'), { playerId: playerId.substring(0,8), name: currentCharacter.name, score: highScore, timestamp: Date.now() }); }
    function loadFriends() { if (isAuthenticated && !playerId.startsWith('local_')) get(ref(db, 'accounts/'+playerId+'/friends')).then(s => { if (s.exists()) friends = s.val()||[]; }); }

    function saveToLocal() {
      try {
        localStorage.setItem('runnerHighScore', highScore); localStorage.setItem('runnerCrystals', crystals);
        localStorage.setItem('runnerCryptostals', cryptostals); localStorage.setItem('runnerOwnedSkins', JSON.stringify([...ownedSkins]));
        localStorage.setItem('runnerOwnedCharacters', JSON.stringify([...ownedCharacters]));
        localStorage.setItem('runnerUsedPromocodes', JSON.stringify([...usedPromocodes]));
        localStorage.setItem('runnerCharacter', currentCharacter.id);
        localStorage.setItem('runnerActiveSkin', activeSkin?.id||''); localStorage.setItem('runnerStats', JSON.stringify(stats));
        localStorage.setItem('runnerLootboxDay', lastLootboxDay);
      } catch(e) {}
    }

    function loadFromLocal() {
      try {
        highScore = parseInt(localStorage.getItem('runnerHighScore'))||0; crystals = parseInt(localStorage.getItem('runnerCrystals'))||0;
        cryptostals = parseInt(localStorage.getItem('runnerCryptostals'))||0;
        ownedSkins = new Set(JSON.parse(localStorage.getItem('runnerOwnedSkins')||'[]'));
        ownedCharacters = new Set(JSON.parse(localStorage.getItem('runnerOwnedCharacters')||'["leo","dino","cat","dog","panther","bear","fox","rabbit","cyborg"]'));
        usedPromocodes = new Set(JSON.parse(localStorage.getItem('runnerUsedPromocodes')||'[]'));
        currentCharacter = Object.values(CHARACTERS).find(c=>c.id===localStorage.getItem('runnerCharacter'))||CHARACTERS.LEO;
        activeSkin = localStorage.getItem('runnerActiveSkin') ? (ALL_SKINS[localStorage.getItem('runnerActiveSkin').toUpperCase()]||null) : null;
        stats = JSON.parse(localStorage.getItem('runnerStats')||'{"jumps":0,"deaths":0,"crystalsCollected":0,"totalScore":0}');
        lastLootboxDay = localStorage.getItem('runnerLootboxDay')||''; lootboxReady = lastLootboxDay !== new Date().toDateString();
      } catch(e) {}
    }

    function saveData() { saveToLocal(); }
    function updateUI() { recordDisplay.textContent = highScore; }

    function generateDailyQuests() {
      const t = [{d:'3000',v:3000},{d:'5000',v:5000},{d:'8000',v:8000},{d:'10000',v:10000}];
      dailyQuests=[]; const u=new Set(); while(dailyQuests.length<4){const q=t[Math.floor(Math.random()*t.length)]; if(!u.has(q.d)){u.add(q.d);dailyQuests.push({...q});}} dailyClaimed=[false,false,false,false];
    }
    function generateWeeklyQuests() {
      const t=[{d:'25000',v:25000},{d:'35000',v:35000},{d:'50000',v:50000},{d:'record',v:'record'}];
      weeklyQuests=[]; const u=new Set(); while(weeklyQuests.length<2){const q=t[Math.floor(Math.random()*t.length)]; if(!u.has(q.d)){u.add(q.d);weeklyQuests.push({...q});}} weeklyClaimed=[false,false];
    }
    function generatePassQuests() {
      const q=[{d:'Счёт 8000',t:'score',v:8000,x:150},{d:'Счёт 20000',t:'score',v:20000,x:250},{d:'Рекорд',t:'record',x:200},{d:'Скин Золотой',t:'skin',v:'golden',x:100}];
      passQuests=[]; const u=new Set(); while(passQuests.length<4){const r=q[Math.floor(Math.random()*q.length)]; if(!u.has(r.d)){u.add(r.d);passQuests.push({...r});}} passClaimed=[false,false,false,false]; lastPassReset=new Date().toISOString(); saveData();
    }
    function resetPassIfNeeded() {
      const n=new Date(); if(lastPassReset){const h=(n-new Date(lastPassReset))/36e5; if(h>=PASS_RESET)generatePassQuests();}else generatePassQuests();
    }
    function checkPassQuests() {
      passQuests.forEach((q,i)=>{if(!passClaimed[i]){let ok=false; if(q.t==='score'&&score>=q.v)ok=true; if(q.t==='record'&&highScore>0)ok=true; if(q.t==='skin'&&activeSkin&&activeSkin.id===q.v)ok=true; if(ok){passClaimed[i]=true;passXP+=q.x;while(passXP>=PASS_XP){passXP-=PASS_XP;passLevel++;crystals+=500;}saveData();}}});
    }

    function checkQuestCompletion() {
      dailyQuests.forEach((q,i)=>{if(!dailyClaimed[i]&&score>=q.v){dailyClaimed[i]=true;crystals+=500;saveData();}});
      weeklyQuests.forEach((q,i)=>{if(!weeklyClaimed[i]){if(q.v==='record'&&highScore>0){weeklyClaimed[i]=true;crystals+=2000;saveData();}else if(typeof q.v==='number'&&score>=q.v){weeklyClaimed[i]=true;crystals+=2000;saveData();}}});
    }

    function openLootbox() {
      lootboxReady=false; lastLootboxDay=new Date().toDateString();
      const r=[{t:'crystals',a:200},{t:'crystals',a:500},{t:'crystals',a:1000},{t:'cryptostals',a:100},{t:'cryptostals',a:300}][Math.floor(Math.random()*5)];
      if(r.t==='crystals')crystals+=r.a; else cryptostals+=r.a;
      saveData(); alert('🎁 Получено: '+(r.t==='crystals'?'💎':'🔮')+' '+r.a);
    }

    function resetGame() {
      character.y=GROUND_Y-54; character.vy=0; character.grounded=true;
      obstacles=[]; birds=[]; crystalsOnMap=[]; spawnTimer=0; nextSpawnIn=70+Math.floor(Math.random()*60);
      score=0; currentSpeed=baseSpeed; gameOver=false; paused=false; continueActive=false;
      restartHint.style.display='none'; continueOverlay.style.display='none';
      if(continueInterval)clearInterval(continueInterval);
      inGameMenuBtn.style.display='none'; pauseButton.textContent='⏸️ Пауза'; pauseButton.style.display='block';
      speedBoostActive=false; doubleCrystalsActive=false; fireworks=[];
    }

    function triggerGameOver() {
      gameOver=true; stats.deaths++;
      if(score>highScore){highScore=score; submitScore();}
      saveData(); saveToCloud();
      if(crystals>=100){continueActive=true;continueOverlay.style.display='flex';continueSeconds=8;continueTimer.textContent='8';restartHint.style.display='none';pauseButton.style.display='none';continueInterval=setInterval(()=>{continueSeconds--;continueTimer.textContent=continueSeconds;if(continueSeconds<=0){clearInterval(continueInterval);continueActive=false;continueOverlay.style.display='none';restartHint.style.display='block';}},1000);}
      else{restartHint.style.display='block';}
    }

    function continueGame() {
      if(!continueActive||crystals<100)return;
      crystals-=100; continueActive=false; continueOverlay.style.display='none';
      if(continueInterval)clearInterval(continueInterval);
      gameOver=false; character.y=GROUND_Y-54; character.vy=0; character.grounded=true;
      obstacles=obstacles.filter(o=>o.x>180); birds=birds.filter(b=>b.x>180);
      saveData(); updateUI(); pauseButton.style.display='block';
    }

    function declineContinue() { continueActive=false; continueOverlay.style.display='none'; if(continueInterval)clearInterval(continueInterval); restartHint.style.display='block'; pauseButton.style.display='block'; }

    function attemptJump() {
      if(continueActive||menuOpen)return;
      if(gameOver){resetGame();return;}
      if(paused){paused=false;pauseButton.textContent='⏸️ Пауза';inGameMenuBtn.style.display='none';return;}
      if(character.grounded){character.vy=currentCharacter.jumpBonus?-16:-14;character.grounded=false;stats.jumps++;}
    }

    function togglePause() { if(continueActive||menuOpen)return; if(gameOver){resetGame();return;} paused=!paused; pauseButton.textContent=paused?'▶️ Играть':'⏸️ Пауза'; inGameMenuBtn.style.display=paused?'block':'none'; }
    function openMenu() { if(continueActive)return; menuOpen=true; paused=true; menuOverlay.style.display='flex'; pauseButton.style.display='none'; inGameMenuBtn.style.display='none'; renderMenu('characters'); }
    function closeMenu() { menuOpen=false; paused=false; menuOverlay.style.display='none'; pauseButton.style.display='block'; }

      menuPanel.querySelectorAll('.menu-tab').forEach(b => b.addEventListener('click', () => { const t=b.dataset.t; if(t==='lootbox'){openLootbox();renderMenu('characters');} else renderMenu(t); }));

      else if(tab==='pass') renderPass(c); else if(tab==='promo') renderPromo(c);

    function renderChars(c) {
      c.innerHTML='<div class="grid"></div>'; const g=c.querySelector('.grid');

        card.innerHTML=`<div class="preview" style="background:${ch.color};"></div><div class="card-name">${ch.name}</div>`;
        card.addEventListener('click',()=>{currentCharacter=ch;saveData();renderMenu('characters');}); g.appendChild(card); });

        const card=document.createElement('div'); card.className='card';

        '<div class="card"><h4>💎 Удвоение кристаллов</h4><p>x2 кристаллы на 30 сек</p><button class="btn" id="bDouble">💎 100</button></div>' +

        document.getElementById('bDouble')?.addEventListener('click', () => { if (crystals >= 100) { crystals -= 100; doubleCrystalsActive = true; doubleCrystalsTimer = 30 * 60; closeMenu(); saveData(); } });

    function renderSkins(c) {
      const avail=Object.values(ALL_SKINS).filter(s=>ownedSkins.has(s.id)||s.id==='classic');

        card.addEventListener('click',()=>{activeSkin=s;saveData();renderMenu('skins');}); g.appendChild(card);

    function renderLB(c) {
      c.innerHTML='<h3>🏆 Топ-10</h3><table class="leaderboard-table"><tr><th>#</th><th>ID</th><th>Счёт</th></tr><tbody id="lbBody"></tbody></table>';

    function renderQuests(c) {

      c.innerHTML+='<strong>📆 Еженедельные:</strong><br>'; weeklyQuests.forEach((q,i)=>{c.innerHTML+=`<div class="quest-item">${q.d} ${weeklyClaimed[i]?'✅':'(💎2000)'}</div>`;});
    }

    function renderPass(c) {
      resetPassIfNeeded();
      c.innerHTML=`<div><strong>🌵 Kaktus Pass — Ур. ${passLevel}</strong></div><div class="pass-progress"><div class="pass-fill" style="width:${(passXP/PASS_XP)*100}%"></div></div><div style="font-size:0.7rem;">${passXP}/${PASS_XP} XP</div><strong>Задания:</strong><br>`;
      passQuests.forEach((q,i)=>{c.innerHTML+=`<div class="quest-item">${q.d} (${q.x} XP) ${passClaimed[i]?'✅':''}</div>`;});
    }

    function renderPromo(c) {
      c.innerHTML=`<h3>🎫 Промокоды</h3><input type="text" class="promo-input" id="promoInput" placeholder="Введите код" autocomplete="off"><button class="btn" id="activatePromoBtn" style="background:#ff9800;margin:10px 0;">Активировать</button><div class="promo-message" id="promoMessage"></div><p style="font-size:0.65rem;">GOLDEN2026 | KOSMOMAY | KRIPT2026 | KRISTMAY | FAILPRISE | NEONLIFE</p>`;
      setTimeout(()=>{
        const inp=document.getElementById('promoInput'); inp.addEventListener('mousedown',e=>e.stopPropagation());
        document.getElementById('activatePromoBtn').addEventListener('click',()=>{
          const code=inp.value.toUpperCase().trim(); const promo=PROMOCODES[code]; const msg=document.getElementById('promoMessage');
          if(!promo){msg.className='promo-message error';msg.textContent='Неверный код!';return;}
          if(promo.oneTime&&usedPromocodes.has(code)){msg.className='promo-message error';msg.textContent='Уже использован!';return;}
          if(promo.reward.type==='skin'){if(ownedSkins.has(promo.reward.skinId)){msg.className='promo-message error';msg.textContent='Скин уже есть!';return;}ownedSkins.add(promo.reward.skinId);}
          else if(promo.reward.type==='crystals')crystals+=promo.reward.amount;
          else if(promo.reward.type==='cryptostals')cryptostals+=promo.reward.amount;
          else if(promo.reward.type==='combo'){ownedSkins.add(promo.reward.skinId);crystals+=promo.reward.crystals;}
          usedPromocodes.add(code); saveData(); saveToCloud();
          msg.className='promo-message success'; msg.textContent='✅ Активирован!';
        });
      },100);
    }

    function getSkinColor(s) {
      if(!s) return currentCharacter.color;
      if(s.chromatic) return `hsl(${Date.now()*0.2%360},80%,50%)`;
      if(s.ultra) return `hsl(${Date.now()*0.3%360},90%,60%)`;
      if(s.flame) return 'linear-gradient(#ffd600,#d50000)';
      if(s.neon) return '#00ff88';
      return s.color;
    }

    function update() {
      if(gameOver||paused||menuOpen||continueActive)return;
      if(!character.grounded){character.vy+=character.gravity;character.y+=character.vy;if(character.y>=GROUND_Y-54){character.y=GROUND_Y-54;character.vy=0;character.grounded=true;}}
      let sm = 1 + Math.floor(score/5000)*0.5;
      if(speedBoostActive){sm*=1.5;speedBoostTimer--;if(speedBoostTimer<=0)speedBoostActive=false;}
      currentSpeed=baseSpeed*sm;
      spawnTimer++; if(spawnTimer>=nextSpawnIn){spawnTimer=0;nextSpawnIn=70+Math.floor(Math.random()*60);obstacles.push({x:CANVAS_WIDTH,y:GROUND_Y-(40+Math.random()*25),width:30,height:40+Math.random()*25});}
      if(Math.random()<0.008)crystalsOnMap.push({x:CANVAS_WIDTH,y:GROUND_Y-30-Math.random()*100,w:15,h:15});
      for(let i=obstacles.length-1;i>=0;i--){obstacles[i].x-=currentSpeed;if(obstacles[i].x<-50)obstacles.splice(i,1);}
      for(let i=crystalsOnMap.length-1;i>=0;i--){crystalsOnMap[i].x-=currentSpeed;if(crystalsOnMap[i].x<-50)crystalsOnMap.splice(i,1);}
      for(let i=crystalsOnMap.length-1;i>=0;i--){const cr=crystalsOnMap[i];if(character.x<cr.x+cr.w&&character.x+44>cr.x&&character.y<cr.y+cr.h&&character.y+54>cr.y){let a=5;if(doubleCrystalsActive)a*=2;crystals+=a;stats.crystalsCollected+=a;crystalsOnMap.splice(i,1);}}
      if(doubleCrystalsActive){doubleCrystalsTimer--;if(doubleCrystalsTimer<=0)doubleCrystalsActive=false;}
      score+=Math.floor(currentSpeed*0.7);stats.totalScore+=Math.floor(currentSpeed*0.7);
      if(score>highScore){highScore=score;updateUI();}
      checkQuestCompletion();checkPassQuests();
      for(const o of obstacles){if(character.x<o.x+o.width&&character.x+44>o.x&&character.y<o.y+o.height&&character.y+54>o.y){triggerGameOver();return;}}
    }

    function draw() {
      ctx.clearRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
      ctx.fillStyle=score>=25000?'#1a1a1a':'#fff';ctx.fillRect(0,0,CANVAS_WIDTH,GROUND_Y);
      ctx.fillStyle=score>=25000?'#f0f0f0':'#1a1a1a';ctx.fillRect(0,GROUND_Y,CANVAS_WIDTH,CANVAS_HEIGHT-GROUND_Y);
      crystalsOnMap.forEach(cr=>{ctx.fillStyle='#00BCD4';ctx.fillRect(cr.x,cr.y,cr.w,cr.h);});
      obstacles.forEach(o=>{ctx.fillStyle='#2e7d32';ctx.fillRect(o.x,o.y,o.width,o.height);ctx.fillStyle='#4caf50';ctx.fillRect(o.x+3,o.y+3,o.width-6,o.height-6);});
      const {x,y}=character;
      const skin = activeSkin;
      const ch = currentCharacter;
      const pc = skin ? (skin.color||ch.color) : ch.color;
      const sc = skin ? (skin.secondary||ch.secondary) : ch.secondary;
      const bc = skin ? (skin.belly||ch.belly) : ch.belly;
      const ei = skin ? (skin.earInner||ch.earInner) : ch.earInner;
      let bodyFill = pc;
      if (skin?.chromatic) { const t = Date.now()*0.003; bodyFill = `rgb(${128+Math.sin(t)*127},${128+Math.sin(t+2)*127},${128+Math.sin(t+4)*127})`; }
      else if (skin?.ultra) { const t = Date.now()*0.004; bodyFill = `rgb(${128+Math.sin(t)*127},${128+Math.sin(t+2.5)*127},${128+Math.sin(t+5)*127})`; }
      else if (skin?.flame) { const g = ctx.createLinearGradient(x, y, x, y+54); g.addColorStop(0, '#ffd600'); g.addColorStop(1, '#d50000'); bodyFill = g; }
      else if (skin?.neon) { bodyFill = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 10; }

      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x+22, y+50, 15, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = bodyFill; ctx.beginPath(); ctx.ellipse(x+22, y+30, 15, 19, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = bc; ctx.beginPath(); ctx.ellipse(x+22, y+32, 10, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      ctx.fillStyle = bodyFill; ctx.beginPath(); ctx.arc(x+31, y+14, 11, 0, Math.PI*2); ctx.fill();
      if (ch.earShape === 'long_ears') {
        ctx.fillStyle = pc; ctx.beginPath(); ctx.ellipse(x+20, y-4, 5, 16, 0.1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+36, y-5, 5, 16, -0.1, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = ei; ctx.beginPath(); ctx.ellipse(x+20, y-4, 3, 10, 0.1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+36, y-5, 3, 10, -0.1, 0, Math.PI*2); ctx.fill();
      } else if (ch.earShape === 'spikes') {
        ctx.fillStyle = sc; ctx.beginPath(); ctx.moveTo(x+24, y+5); ctx.lineTo(x+29, y-6); ctx.lineTo(x+34, y+5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x+38, y+4); ctx.lineTo(x+43, y-7); ctx.lineTo(x+48, y+4); ctx.fill();
      } else {
        ctx.fillStyle = pc; ctx.beginPath(); ctx.arc(x+24, y+4, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+40, y+4, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = ei; ctx.beginPath(); ctx.arc(x+24, y+4, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+40, y+4, 3, 0, Math.PI*2); ctx.fill();
      }
      if (ch.spiderEmblem) {
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+22, y+30, 4, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        for (let i=0;i<8;i++) { const a = i*Math.PI/4; ctx.beginPath(); ctx.moveTo(x+22,y+30); ctx.lineTo(x+22+Math.cos(a)*6, y+30+Math.sin(a)*6); ctx.stroke(); }
      }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x+27, y+11, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+38, y+11, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+28, y+11, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+39, y+11, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = sc; ctx.beginPath(); ctx.ellipse(x+10, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+26, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = pc; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x+5, y+40); ctx.quadraticCurveTo(x-8, y+32, x-5, y+20); ctx.stroke();
      ctx.fillStyle = score>=25000?'#fff':'#212121'; ctx.font = 'bold 20px "Courier New"';
      ctx.fillText(`${currentCharacter.name}: ${score}`, 20, 45);
      if (gameOver && !continueActive) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT); ctx.fillStyle = '#fff'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center'; ctx.fillText('💀 КОНЕЦ ИГРЫ', CANVAS_WIDTH/2, CANVAS_HEIGHT/2); ctx.textAlign = 'left'; }
    }

    function gameLoop() { update(); draw(); gameLoopId = requestAnimationFrame(gameLoop); }

    canvas.addEventListener('click', e => { if (document.activeElement?.tagName === 'INPUT') return; e.preventDefault(); attemptJump(); });
    canvas.addEventListener('touchstart', e => { if (document.activeElement?.tagName === 'INPUT') return; e.preventDefault(); attemptJump(); });
    pauseButton.addEventListener('click', e => { e.stopPropagation(); togglePause(); });
    inGameMenuBtn.addEventListener('click', e => { e.stopPropagation(); openMenu(); });
    continueYes.addEventListener('click', e => { e.stopPropagation(); continueGame(); });
    continueNo.addEventListener('click', e => { e.stopPropagation(); declineContinue(); });
    window.addEventListener('keydown', e => { if (document.activeElement?.tagName === 'INPUT') return; if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); attemptJump(); } if (e.key === 'Escape') { e.preventDefault(); if (menuOpen) closeMenu(); else togglePause(); } });

    function resetDailyIfNeeded() { const t = new Date().toDateString(); if (lastDailyReset !== t) { dailyClaimed = [false,false,false,false]; lastDailyReset = t; generateDailyQuests(); saveData(); } }
    function resetWeeklyIfNeeded() { const n = new Date(); if (n.getDay() === 0) { const t = n.toDateString(); if (lastWeeklyReset !== t) { weeklyClaimed = [false,false]; lastWeeklyReset = t; generateWeeklyQuests(); saveData(); } } }

    function startGame() {
      resetDailyIfNeeded(); resetWeeklyIfNeeded();
      if (!dailyQuests.length) generateDailyQuests();
      if (!weeklyQuests.length) generateWeeklyQuests();
      if (!passQuests.length) generatePassQuests();
      updateUI(); resetGame(); gameLoop();
    }

    showAuth();
    setInterval(() => { saveData(); if (isAuthenticated && !playerId.startsWith('local_')) saveToCloud(); }, 30000);
  }

  initApp().catch(err => console.error('Ошибка инициализации:', err));
</script>
</body>
</html>
