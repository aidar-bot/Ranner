<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
  <title>Раннер • Firebase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation; user-select: none;
    }
    .game-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .game-container {
      position: relative; background-color: #f7f7f7; border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; width: 100%; max-width: 800px;
    }
    canvas { display: block; width: 100%; height: auto; background-color: #fff; cursor: pointer; }
    .record-panel {
      position: absolute; top: 12px; right: 20px; background: rgba(0,0,0,0.7);
      color: #fdd835; padding: 8px 18px; border-radius: 40px; font-weight: bold; font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; pointer-events: none;
    }
    .music-toggle, .pause-button {
      position: absolute; top: 12px; background: rgba(0,0,0,0.7); color: white;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 40px; padding: 8px 14px;
      font-weight: bold; font-size: 1.1rem; cursor: pointer; z-index: 20;
      font-family: 'Courier New', monospace;
    }
    .music-toggle { left: 20px; }
    .pause-button { left: 50%; transform: translateX(-50%); }
    .restart-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ddd; padding: 6px 18px; border-radius: 20px;
      font-size: 0.9rem; z-index: 10; pointer-events: none; display: none;
    }
    .continue-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 25; display: none;
    }
    .continue-panel {
      background: #1e1e2e; border: 2px solid #fdd835; border-radius: 20px;
      padding: 20px 30px; text-align: center; color: white;
    }
    .continue-panel h3 { color: #fdd835; margin-bottom: 10px; }
    .timer { font-size: 2rem; color: #ff5252; font-weight: bold; margin: 15px 0; }
    .continue-buttons { display: flex; gap: 15px; justify-content: center; }
    .continue-btn, .decline-btn { padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; border: none; color: white; }
    .continue-btn { background: #4caf50; }
    .decline-btn { background: #f44336; }
    .in-game-menu-btn {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fdd835; border-radius: 40px; padding: 8px 18px;
      font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 20; display: none;
      font-family: 'Courier New', monospace; border: 1px solid rgba(255,255,255,0.25);
    }
    .menu-overlay, .auth-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center;
      align-items: center; z-index: 30; border-radius: 24px;
    }
    .menu-panel, .auth-panel {
      background: #1e1e2e; border: 2px solid #555; border-radius: 24px; padding: 20px;
      width: 90%; max-width: 600px; color: white; text-align: center;
      max-height: 80vh; overflow-y: auto;
    }
    .auth-panel { max-width: 400px; }
    .menu-panel h2, .auth-panel h2 { margin-bottom: 15px; font-size: 1.8rem; color: #fdd835; }
    .currencies-menu { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; font-weight: bold; }
    .crystals { color: #80d8ff; }
    .cryptostals { color: #ff80ab; }
    .menu-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .menu-tab { background: #333; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.75rem; }
    .menu-tab.active { background: #fdd835; color: #222; }
    .menu-content { text-align: left; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: #333; border-radius: 16px; padding: 10px; cursor: pointer; border: 2px solid transparent; text-align: center; }
    .card.selected { border-color: #fdd835; box-shadow: 0 0 15px rgba(253,216,53,0.5); }
    .card:hover { background: #444; }
    .preview { width: 50px; height: 50px; margin: 0 auto 6px; border-radius: 10px; }
    .card-name { font-weight: bold; font-size: 0.8rem; }
    .card-price { font-size: 0.7rem; }
    .card-price.crystals { color: #80d8ff; }
    .card-price.cryptostals { color: #ff80ab; }
    .btn { background: #fdd835; color: #222; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .close-btn { margin-top: 20px; }
    .auth-input {
      background: #333; border: 2px solid #555; color: white; padding: 12px;
      border-radius: 12px; font-size: 1.1rem; text-align: center; font-family: 'Courier New', monospace;
      width: 100%; margin: 10px 0;
    }
    .auth-input:focus { outline: none; border-color: #fdd835; }
    .auth-label { display: block; text-align: left; margin-top: 10px; color: #aaa; font-size: 0.9rem; }
    .auth-message { margin: 10px 0; padding: 10px; border-radius: 12px; font-weight: bold; display: none; }
    .auth-message.error { background: #b71c1c; color: #ef9a9a; display: block; }
    .auth-message.success { background: #1b5e20; color: #81c784; display: block; }
    .promo-input {
      background: #333; border: 2px solid #555; color: white; padding: 12px;
      border-radius: 12px; font-size: 1.2rem; text-align: center; font-family: 'Courier New', monospace;
      width: 100%; margin: 10px 0;
    }
    .promo-message { margin: 10px 0; padding: 10px; border-radius: 12px; font-weight: bold; display: none; }
    .promo-message.success { background: #1b5e20; color: #81c784; display: block; }
    .promo-message.error { background: #b71c1c; color: #ef9a9a; display: block; }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.75rem; }
    .leaderboard-table th { background: #333; padding: 8px; text-align: left; }
    .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; }
    .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
    .leaderboard-table tr:nth-child(2) td { color: #c0c0c0; }
    .leaderboard-table tr:nth-child(3) td { color: #cd7f32; }
    .chat-box { background: #111; border-radius: 12px; padding: 10px; max-height: 200px; overflow-y: auto; margin: 10px 0; }
    .chat-msg { margin: 5px 0; font-size: 0.8rem; }
    .chat-msg .sender { color: #fdd835; font-weight: bold; }
    .chat-input { display: flex; gap: 5px; }
    .chat-input input { flex: 1; background: #333; border: 1px solid #555; color: white; padding: 8px; border-radius: 8px; font-family: 'Courier New', monospace; }
    .friend-list { margin: 10px 0; }
    .friend-item { background: #2a2a3a; padding: 8px 12px; border-radius: 8px; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    .friend-item button { padding: 4px 10px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 0.7rem; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button class="music-toggle" id="musicToggle">🔊</button>
    <div class="record-panel">🏆 <span id="recordDisplay">0</span></div>
    <button class="pause-button" id="pauseButton">⏸️ Пауза</button>
    <button class="in-game-menu-btn" id="inGameMenuBtn">🏠 Меню</button>
    <div class="restart-hint" id="restartHint">🔄 Коснитесь / Пробел для рестарта</div>
    <div class="continue-overlay" id="continueOverlay">
      <div class="continue-panel">
        <h3>💀 Вы проиграли!</h3>
        <p>Продолжить за 💎100?</p>
        <div class="timer" id="continueTimer">8</div>
        <div class="continue-buttons">
          <button class="continue-btn" id="continueYes">✅ Да</button>
          <button class="decline-btn" id="continueNo">❌ Нет</button>
        </div>
      </div>
    </div>
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-panel" id="authPanel"></div>
    </div>
    <div class="menu-overlay" id="menuOverlay" style="display: none;">
      <div class="menu-panel" id="menuPanel"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getDatabase, ref, set, get, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzSkne1P83HnZuDLboLBBHC2dK1RDiuhM",
    authDomain: "runnerr-20f52.firebaseapp.com",
    databaseURL: "https://runnerr-20f52-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "runnerr-20f52",
    storageBucket: "runnerr-20f52.firebasestorage.app",
    messagingSenderId: "133710015550",
    appId: "1:133710015550:web:bcbf049afd31578a74b56f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  console.log('🔥 Firebase подключен!');

  // ============ СИСТЕМА АККАУНТОВ ============
  const authOverlay = document.getElementById('authOverlay');
  const authPanel = document.getElementById('authPanel');
  let playerId = localStorage.getItem('runnerPlayerId');
  let codeWord = localStorage.getItem('runnerCodeWord');
  let isAuthenticated = false;

  function generateId() {
    return 'RNR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  function generateCodeWord() {
    const words = ['Fire', 'Star', 'Moon', 'Wind', 'Wolf', 'Bear', 'Fox', 'Lion', 'Eagle', 'Hawk', 'Jade', 'Ruby', 'Gold', 'Iron', 'Steel', 'Storm', 'Frost', 'Blaze', 'Shadow', 'Light'];
    return words[Math.floor(Math.random() * words.length)] + Math.floor(Math.random() * 1000);
  }

  function showAuth() {
    if (playerId && codeWord) {
      // Попытка автоматического входа
      verifyLogin(playerId, codeWord, (success) => {
        if (success) {
          authOverlay.style.display = 'none';
          isAuthenticated = true;
          loadGameData();
          startGame();
        } else {
          renderAuthMenu('main');
        }
      });
    } else {
      renderAuthMenu('main');
    }
  }

  function verifyLogin(id, word, callback) {
    get(ref(db, 'accounts/' + id)).then(snapshot => {
      if (snapshot.exists() && snapshot.val().codeWord === word) {
        callback(true);
      } else {
        callback(false);
      }
    }).catch(() => callback(false));
  }

  function renderAuthMenu(screen) {
    if (screen === 'main') {
      authPanel.innerHTML = `
        <h2>🎮 Раннер</h2>
        <p style="color:#aaa;margin-bottom:20px;">Добро пожаловать!</p>
        <button class="btn" id="btnRegister" style="width:100%;margin:10px 0;padding:15px;">📝 Регистрация</button>
        <button class="btn" id="btnLogin" style="width:100%;margin:10px 0;padding:15px;background:#2196f3;color:white;">🔑 Вход</button>
      `;
      document.getElementById('btnRegister').addEventListener('click', () => renderAuthMenu('register'));
      document.getElementById('btnLogin').addEventListener('click', () => renderAuthMenu('login'));
    } else if (screen === 'register') {
      const newId = generateId();
      const newWord = generateCodeWord();
      authPanel.innerHTML = `
        <h2>📝 Регистрация</h2>
        <div style="background:#1b5e20;padding:15px;border-radius:12px;margin:15px 0;text-align:left;">
          <p><strong>Ваш ID:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newId}</span></p>
          <p><strong>Кодовое слово:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newWord}</span></p>
          <p style="color:#ff9800;font-size:0.8rem;margin-top:10px;">⚠️ Сохраните эти данные! Они нужны для входа с других устройств.</p>
        </div>
        <button class="btn" id="btnConfirmRegister" style="width:100%;padding:15px;">✅ Я сохранил(а)</button>
        <button class="btn" id="btnBack" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
      `;
      document.getElementById('btnConfirmRegister').addEventListener('click', () => {
        set(ref(db, 'accounts/' + newId), {
          codeWord: newWord,
          createdAt: Date.now()
        }).then(() => {
          playerId = newId;
          codeWord = newWord;
          localStorage.setItem('runnerPlayerId', playerId);
          localStorage.setItem('runnerCodeWord', codeWord);
          authOverlay.style.display = 'none';
          isAuthenticated = true;
          loadGameData();
          startGame();
        });
      });
      document.getElementById('btnBack').addEventListener('click', () => renderAuthMenu('main'));
    } else if (screen === 'login') {
      authPanel.innerHTML = `
        <h2>🔑 Вход</h2>
        <label class="auth-label">ID:</label>
        <input type="text" class="auth-input" id="loginId" placeholder="RNR-XXXXXX">
        <label class="auth-label">Кодовое слово:</label>
        <input type="text" class="auth-input" id="loginWord" placeholder="Ваше кодовое слово">
        <div class="auth-message" id="authMessage"></div>
        <button class="btn" id="btnConfirmLogin" style="width:100%;padding:15px;margin-top:10px;">Войти</button>
        <button class="btn" id="btnBack2" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
      `;
      const msgDiv = document.getElementById('authMessage');
      document.getElementById('btnConfirmLogin').addEventListener('click', () => {
        const id = document.getElementById('loginId').value.trim();
        const word = document.getElementById('loginWord').value.trim();
        if (!id || !word) {
          msgDiv.className = 'auth-message error';
          msgDiv.textContent = 'Заполните все поля!';
          return;
        }
        verifyLogin(id, word, (success) => {
          if (success) {
            playerId = id;
            codeWord = word;
            localStorage.setItem('runnerPlayerId', playerId);
            localStorage.setItem('runnerCodeWord', codeWord);
            authOverlay.style.display = 'none';
            isAuthenticated = true;
            loadGameData();
            startGame();
          } else {
            msgDiv.className = 'auth-message error';
            msgDiv.textContent = 'Неверный ID или кодовое слово!';
          }
        });
      });
      document.getElementById('btnBack2').addEventListener('click', () => renderAuthMenu('main'));
    }
    authOverlay.style.display = 'flex';
  }

  // ============ ИГРОВЫЕ ПЕРЕМЕННЫЕ ============

  const ctx = canvas.getContext('2d');

  let stars = [];
  for (let i = 0; i < 60; i++) {

  const CHARACTERS = {

    DOG: { id: 'dog', name: 'Собачка', type: 'animal', color: '#8d6e63', secondary: '#5d4037', belly: '#d7ccc8', earInner: '#bcaaa4', hasTongue: true, tongueColor: '#ff5252', earShape: 'floppy', tailType: 'waggy' },

    EARTH: { id: 'earth', name: 'Земля', type: 'planet', price: 3000, color: '#2196f3', secondary: '#4caf50', belly: '#fff', earthColors: true },
    MOON: { id: 'moon', name: 'Луна', type: 'planet', price: 2500, color: '#9e9e9e', secondary: '#757575', belly: '#bdbdbd', moonCraters: true },
    CYBORG: { id: 'cyborg', name: 'Киборг', type: 'animal', price: 8000, color: '#607d8b', secondary: '#455a64', belly: '#90a4ae', earInner: '#78909c', roboEyes: true, metalBody: true, earShape: 'robotic', tailType: 'short' },

  let currentCharacter = CHARACTERS.LEO;
  let ownedCharacters = new Set(['leo', 'dino', 'cat', 'dog', 'panther', 'bear', 'fox', 'rabbit']);

  const ALL_SKINS = {
    GOLDEN: { id: 'golden', name: 'Золотой', price: 1500, color: '#ffd700', secondary: '#b8860b', belly: '#fff176', earInner: '#ffec80', currency: 'crystals' },
    RARE: { id: 'rare', name: 'Редкий', price: 2000, color: '#2196f3', secondary: '#0d47a1', belly: '#90caf9', earInner: '#64b5f6', currency: 'crystals' },
    EPIC: { id: 'epic', name: 'Эпический', price: 3000, color: '#9c27b0', secondary: '#6a1b9a', belly: '#ce93d8', earInner: '#e1bee7', currency: 'crystals' },
    COSMIC: { id: 'cosmic', name: 'Космический', price: 10000, color: '#7c4dff', secondary: '#651fff', belly: '#b388ff', earInner: '#d1c4e9', currency: 'crystals' },

  let activeSkin = null;
  let ownedSkins = new Set();

    'KOSMOMAY': { reward: { type: 'skin', skinId: 'cosmic' }, description: 'Космический скин', oneTime: true },
    'KRIPT2026': { reward: { type: 'cryptostals', amount: 5000 }, description: '5000 криптосталлов', oneTime: true },
    'KRISTMAY': { reward: { type: 'crystals', amount: 12000 }, description: '12000 кристаллов', oneTime: true },
    'FAILPRISE': { reward: { type: 'combo', skinId: 'flame', crystals: 3000 }, description: 'Пламенный скин + 3000', oneTime: true },
    'NEONLIFE': { reward: { type: 'skin', skinId: 'neon' }, description: 'Неоновый скин', oneTime: true }
  };
  let usedPromocodes = new Set();

  // ============ FIREBASE ДАННЫЕ ============
  function saveToCloud() {
    if (!isAuthenticated || !playerId) return;
    const data = {
      codeWord: codeWord,
      highScore, crystals, cryptostals, passXP, passLevel,
      character: currentCharacter.id,
      activeSkin: activeSkin ? activeSkin.id : '',
      ownedSkins: [...ownedSkins],
      ownedCharacters: [...ownedCharacters],
      claimedAchievements: [...claimedAchievements],
      usedPromocodes: [...usedPromocodes],
      stats, lastLootboxDay,
      lastUpdated: Date.now()
    };
    set(ref(db, 'accounts/' + playerId), data);
  }

  function loadGameData() {
    if (!isAuthenticated || !playerId) return;
    get(ref(db, 'accounts/' + playerId)).then(snapshot => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        highScore = data.highScore || 0;
        crystals = data.crystals || 0;
        cryptostals = data.cryptostals || 0;
        passXP = data.passXP || 0;
        passLevel = data.passLevel || 1;
        currentCharacter = Object.values(CHARACTERS).find(c => c.id === data.character) || CHARACTERS.LEO;
        activeSkin = data.activeSkin ? (ALL_SKINS[data.activeSkin.toUpperCase()] || null) : null;
        ownedSkins = new Set(data.ownedSkins || []);
        ownedCharacters = new Set(data.ownedCharacters || ['leo', 'dino', 'cat', 'dog', 'panther', 'bear', 'fox', 'rabbit']);
        claimedAchievements = new Set(data.claimedAchievements || []);
        usedPromocodes = new Set(data.usedPromocodes || []);
        stats = data.stats || { jumps: 0, deaths: 0, crystalsCollected: 0, totalScore: 0 };
        lastLootboxDay = data.lastLootboxDay || '';
        lootboxReady = lastLootboxDay !== new Date().toDateString();
        updateUI();
      }
    });
  }

  function submitScore() {
    if (!isAuthenticated || !playerId || highScore === 0) return;
    push(ref(db, 'leaderboard'), {
      playerId: playerId.substring(0, 8),
      name: currentCharacter.name,
      score: highScore,
      skin: activeSkin ? activeSkin.name : 'Стандартный',
      timestamp: Date.now()
    });
  }

  // ============ ДРУЗЬЯ И ЧАТ ============
  let friends = [];
  let currentChat = null;
  let chatMessages = [];

  function addFriend(friendId) {
    if (friendId === playerId) return alert('Нельзя добавить себя!');
    get(ref(db, 'accounts/' + friendId)).then(snapshot => {
      if (snapshot.exists()) {
        if (!friends.includes(friendId)) {
          friends.push(friendId);
          update(ref(db, 'accounts/' + playerId), { friends: friends });
          saveToCloud();
          alert('Друг добавлен!');
        }
      } else {
        alert('Игрок не найден!');
      }
    });
  }

  function loadFriends() {
    get(ref(db, 'accounts/' + playerId + '/friends')).then(snapshot => {
      if (snapshot.exists()) friends = snapshot.val();
    });
  }

  function sendMessage(toId, message) {
    if (!message.trim()) return;
    const chatId = [playerId, toId].sort().join('_');
    push(ref(db, 'chats/' + chatId), {
      from: playerId,
      text: message,
      timestamp: Date.now()
    });
  }

  function loadChat(toId) {
    currentChat = toId;
    const chatId = [playerId, toId].sort().join('_');
    onValue(ref(db, 'chats/' + chatId), (snapshot) => {
      chatMessages = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        chatMessages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
      }
      renderChat();
    });
  }

  function renderChat() {
    const panel = document.getElementById('menuPanel');
    if (!panel || menuOpen !== 'chat') return;
    let html = '<h2>💬 Чат</h2><div class="chat-box">';
    chatMessages.forEach(msg => {
      html += `<div class="chat-msg"><span class="sender">${msg.from.substring(0,8)}:</span> ${msg.text}</div>`;
    });
    html += '</div><div class="chat-input"><input id="chatInput" placeholder="Сообщение..."><button class="btn" id="chatSend">➤</button></div>';
    html += '<button class="btn close-btn" id="closeChatBtn">Назад</button>';
    panel.innerHTML = html;
    document.getElementById('closeChatBtn').addEventListener('click', () => renderMenu('friends'));
    document.getElementById('chatSend').addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      sendMessage(currentChat, input.value);
      input.value = '';
    });
  }

  // ============ МЕНЮ ============
  function updateUI() {
    document.getElementById('recordDisplay').textContent = highScore;
  }

  function openMenu(tab) {
    menuOpen = 'menu';
    paused = true;
    document.getElementById('menuOverlay').style.display = 'flex';
    renderMenu(tab || 'characters');
  }

  function closeMenu() {
    menuOpen = false;
    paused = false;
    document.getElementById('menuOverlay').style.display = 'none';
  }

  function renderMenu(tab) {
    if (tab === 'chat') { renderChat(); return; }
    if (tab === 'friends') { renderFriends(); return; }
    const panel = document.getElementById('menuPanel');
    let html = `
      <h2>🏠 Меню</h2>
      <p style="font-size:0.7rem;color:#aaa;">ID: ${playerId}</p>
      <div class="currencies-menu">
        <span class="crystals">💎 ${crystals}</span>
        <span class="cryptostals">🔮 ${cryptostals}</span>
      </div>
      <div class="menu-tabs">
        <button class="menu-tab ${tab==='characters'?'active':''}" data-tab="characters">🐾</button>
        <button class="menu-tab ${tab==='shop'?'active':''}" data-tab="shop">🛒</button>
        <button class="menu-tab ${tab==='skins'?'active':''}" data-tab="skins">🎨</button>
        <button class="menu-tab ${tab==='leaderboard'?'active':''}" data-tab="leaderboard">🏆</button>
        <button class="menu-tab ${tab==='friends'?'active':''}" data-tab="friends">👥</button>
        <button class="menu-tab ${tab==='promo'?'active':''}" data-tab="promo" style="background:#ff9800;color:#fff;">🎫</button>

    `;
    panel.innerHTML = html;
    document.getElementById('closeMenuBtn').addEventListener('click', closeMenu);
    panel.querySelectorAll('.menu-tab').forEach(btn => {
      btn.addEventListener('click', () => renderMenu(btn.dataset.tab));

  function renderFriends(container) {
    container.innerHTML = `
      <h3>👥 Друзья</h3>
      <div style="display:flex;gap:5px;margin:10px 0;">
        <input class="auth-input" id="friendIdInput" placeholder="ID друга (RNR-...)" style="flex:1;">
        <button class="btn" id="addFriendBtn">+</button>
      </div>
      <div class="friend-list" id="friendList"></div>
      <button class="btn close-btn" id="backFromFriends">Назад</button>
    `;
    document.getElementById('addFriendBtn').addEventListener('click', () => {

    renderFriendsList();

    if (friends.length === 0) {
      list.innerHTML = '<p style="color:#aaa;">Нет друзей</p>';
      return;

    list.innerHTML = '';

      const div = document.createElement('div');

      div.innerHTML = `<span>${fid.substring(0,12)}</span><button class="btn" style="background:#2196f3;color:white;padding:4px 10px;">💬</button>`;
      div.querySelector('button').addEventListener('click', () => {

        renderMenu('chat');

  function renderLeaderboard(container) {
    container.innerHTML = '<h3>🏆 Топ-10 игроков</h3><table class="leaderboard-table"><tr><th>#</th><th>ID</th><th>Счёт</th><th>Персонаж</th></tr></table>';
    const table = container.querySelector('table');

  function renderCharacters(container) {
    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');
    Object.values(CHARACTERS).forEach(ch => {
      if (!ownedCharacters.has(ch.id)) return;
      const card = document.createElement('div');
      card.className = 'card' + (currentCharacter.id === ch.id ? ' selected' : '');
      card.innerHTML = `<div class="preview" style="background:${ch.color};"></div><div class="card-name">${ch.name}</div>`;
      card.addEventListener('click', () => { currentCharacter = ch; saveToCloud(); renderMenu('characters'); });
      grid.appendChild(card);
    });
  }

  function renderShop(container) {
    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');
    Object.values(CHARACTERS).forEach(ch => {
      if (!ch.price || ownedCharacters.has(ch.id)) return;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="preview" style="background:${ch.color};"></div><div class="card-name">${ch.name}</div><div class="card-price crystals">💎${ch.price*2}</div><div class="card-price cryptostals">🔮${ch.price}</div>`;
      card.addEventListener('click', () => {
        if (cryptostals >= ch.price) { cryptostals -= ch.price; ownedCharacters.add(ch.id); saveToCloud(); renderMenu('shop'); }
        else if (crystals >= ch.price*2) { crystals -= ch.price*2; ownedCharacters.add(ch.id); saveToCloud(); renderMenu('shop'); }
      });
      grid.appendChild(card);
    });
    Object.values(ALL_SKINS).forEach(s => {
      if (ownedSkins.has(s.id) || !s.price) return;
      const card = document.createElement('div');
      card.className = 'card';
      const sym = s.currency === 'cryptostals' ? '🔮' : '💎';
      card.innerHTML = `<div class="preview" style="background:${s.flame?'linear-gradient(#ffd600,#d50000)':s.chromatic?'linear-gradient(90deg,red,blue,green)':s.color};"></div><div class="card-name">${s.name}</div><div class="card-price ${s.currency==='cryptostals'?'cryptostals':'crystals'}">${sym}${s.price}</div>`;
      card.addEventListener('click', () => {
        if (s.currency === 'cryptostals' && cryptostals >= s.price) { cryptostals -= s.price; ownedSkins.add(s.id); saveToCloud(); renderMenu('shop'); }
        else if (s.currency === 'crystals' && crystals >= s.price) { crystals -= s.price; ownedSkins.add(s.id); saveToCloud(); renderMenu('shop'); }
      });
      grid.appendChild(card);
    });
  }

  function renderSkins(container) {
    const avail = Object.values(ALL_SKINS).filter(s => ownedSkins.has(s.id));
    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');
    const noneCard = document.createElement('div');
    noneCard.className = 'card' + (!activeSkin ? ' selected' : '');
    noneCard.innerHTML = `<div class="preview" style="background:${currentCharacter.color};"></div><div class="card-name">Стандартный</div>`;
    noneCard.addEventListener('click', () => { activeSkin = null; saveToCloud(); renderMenu('skins'); });
    grid.appendChild(noneCard);
    avail.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card' + (activeSkin?.id === s.id ? ' selected' : '');
      card.innerHTML = `<div class="preview" style="background:${s.flame?'linear-gradient(#ffd600,#d50000)':s.color};"></div><div class="card-name">${s.name}</div>`;
      card.addEventListener('click', () => { activeSkin = s; saveToCloud(); renderMenu('skins'); });
      grid.appendChild(card);
    });
  }

  function renderPromo(container) {
    container.innerHTML = `
      <h3 style="color:#ff9800;">🎫 Промокоды</h3>
      <input type="text" class="promo-input" id="promoInput" placeholder="Введите промокод">
      <button class="btn" id="activatePromoBtn" style="background:#ff9800;">Активировать</button>
      <div class="promo-message" id="promoMessage"></div>
      <p style="font-size:0.7rem;color:#666;margin-top:10px;">GOLDEN2026 | KOSMOMAY | KRIPT2026 | KRISTMAY | FAILPRISE | NEONLIFE</p>
    `;
    setTimeout(() => {
      document.getElementById('activatePromoBtn').addEventListener('click', () => {
        const code = document.getElementById('promoInput').value.toUpperCase().trim();
        const promo = PROMOCODES[code];
        const msgDiv = document.getElementById('promoMessage');
        if (!promo) { msgDiv.className = 'promo-message error'; msgDiv.textContent = 'Неверный промокод!'; return; }
        if (promo.oneTime && usedPromocodes.has(code)) { msgDiv.className = 'promo-message error'; msgDiv.textContent = 'Уже использован!'; return; }
        if (promo.reward.type === 'skin') {
          if (ownedSkins.has(promo.reward.skinId)) { msgDiv.className = 'promo-message error'; msgDiv.textContent = 'Скин уже есть!'; return; }
          ownedSkins.add(promo.reward.skinId);
        } else if (promo.reward.type === 'crystals') crystals += promo.reward.amount;
        else if (promo.reward.type === 'cryptostals') cryptostals += promo.reward.amount;
        else if (promo.reward.type === 'combo') {
          if (ownedSkins.has(promo.reward.skinId)) { msgDiv.className = 'promo-message error'; msgDiv.textContent = 'Скин уже есть!'; return; }
          ownedSkins.add(promo.reward.skinId);
          crystals += promo.reward.crystals;
        }
        usedPromocodes.add(code);
        saveToCloud();
        msgDiv.className = 'promo-message success';
        msgDiv.textContent = '✅ Активирован!';
      });
    }, 100);
  }

  // ============ ИГРОВОЙ ЦИКЛ ============
  function resetGame() {
    character.y = GROUND_Y - 54;
    character.vy = 0;
    character.grounded = true;
    obstacles = [];
    birds = [];
    crystalsOnMap = [];
    spawnTimer = 0;
    nextSpawnIn = 70 + Math.floor(Math.random() * 60);
    score = 0;
    currentSpeed = baseSpeed;
    gameOver = false;
    paused = false;
    continueActive = false;
    document.getElementById('restartHint').style.display = 'none';
    document.getElementById('continueOverlay').style.display = 'none';
    document.getElementById('inGameMenuBtn').style.display = 'none';
    document.getElementById('pauseButton').textContent = '⏸️ Пауза';
    document.getElementById('pauseButton').style.display = 'block';
    fireworks = [];
  }

  function triggerGameOver() {
    gameOver = true;
    stats.deaths++;
    if (score > highScore) {
      highScore = score;
      submitScore();
    }
    saveToCloud();
    if (crystals >= 100) {
      continueActive = true;
      document.getElementById('continueOverlay').style.display = 'flex';
      let sec = 8;
      document.getElementById('continueTimer').textContent = sec;
      const interval = setInterval(() => {
        sec--;
        document.getElementById('continueTimer').textContent = sec;
        if (sec <= 0) {
          clearInterval(interval);
          continueActive = false;
          document.getElementById('continueOverlay').style.display = 'none';
          document.getElementById('restartHint').style.display = 'block';
        }
      }, 1000);
      document.getElementById('restartHint').style.display = 'none';
    } else {
      document.getElementById('restartHint').style.display = 'block';
    }
  }

  function continueGame() {
    if (!continueActive || crystals < 100) return;
    crystals -= 100;
    continueActive = false;
    document.getElementById('continueOverlay').style.display = 'none';
    gameOver = false;
    character.y = GROUND_Y - 54;
    character.vy = 0;
    character.grounded = true;
    obstacles = obstacles.filter(o => o.x > character.x + 100);
    birds = birds.filter(b => b.x > character.x + 100);
    saveToCloud();
  }

  function attemptJump() {
    if (continueActive || menuOpen) return;
    if (gameOver) { resetGame(); return; }
    if (paused) { paused = false; document.getElementById('pauseButton').textContent = '⏸️ Пауза'; document.getElementById('inGameMenuBtn').style.display = 'none'; return; }
    if (character.grounded) {
      character.vy = currentCharacter.jumpBonus ? -16 : -14;
      character.grounded = false;
      stats.jumps++;
    }
  }

  function togglePause() {
    if (continueActive || menuOpen) return;
    if (gameOver) { resetGame(); return; }
    paused = !paused;
    document.getElementById('pauseButton').textContent = paused ? '▶️ Играть' : '⏸️ Пауза';
    document.getElementById('inGameMenuBtn').style.display = paused ? 'block' : 'none';
  }

  function update() {
    if (gameOver || paused || menuOpen || continueActive) return;
    if (!character.grounded) {
      character.vy += character.gravity;
      character.y += character.vy;
      if (character.y >= GROUND_Y - 54) { character.y = GROUND_Y - 54; character.vy = 0; character.grounded = true; }
    }
    currentSpeed = baseSpeed * (1 + Math.floor(score / 5000) * 0.3);
    spawnTimer++;
    if (spawnTimer >= nextSpawnIn) {
      spawnTimer = 0;
      nextSpawnIn = 70 + Math.floor(Math.random() * 60);
      obstacles.push({ x: CANVAS_WIDTH, y: GROUND_Y - (40 + Math.random() * 25), width: 30, height: 40 + Math.random() * 25 });
    }
    if (Math.random() < 0.008) crystalsOnMap.push({ x: CANVAS_WIDTH, y: GROUND_Y - 30 - Math.random() * 100, w: 15, h: 15 });
    if (score > 40000 && Math.random() < 0.005) birds.push({ x: CANVAS_WIDTH, y: Math.random() < 0.5 ? GROUND_Y - 60 : GROUND_Y - 130, width: 44, height: 34 });

    for (let i = obstacles.length-1; i >= 0; i--) { obstacles[i].x -= currentSpeed; if (obstacles[i].x < -50) obstacles.splice(i,1); }
    for (let i = birds.length-1; i >= 0; i--) { birds[i].x -= currentSpeed; if (birds[i].x < -50) birds.splice(i,1); }
    for (let i = crystalsOnMap.length-1; i >= 0; i--) { crystalsOnMap[i].x -= currentSpeed; if (crystalsOnMap[i].x < -50) crystalsOnMap.splice(i,1); }

    for (let i = crystalsOnMap.length-1; i >= 0; i--) {
      const cr = crystalsOnMap[i];
      if (character.x < cr.x+cr.w && character.x+44 > cr.x && character.y < cr.y+cr.h && character.y+54 > cr.y) {
        crystals += 5; stats.crystalsCollected += 5; crystalsOnMap.splice(i,1);
      }
    }

    score += Math.floor(currentSpeed * 0.7);
    stats.totalScore += Math.floor(currentSpeed * 0.7);
    if (score > highScore) { highScore = score; updateUI(); }

    for (const obs of obstacles) {
      if (character.x < obs.x+obs.width && character.x+44 > obs.x && character.y < obs.y+obs.height && character.y+54 > obs.y) { triggerGameOver(); return; }
    }
    for (const bird of birds) {
      if (character.x < bird.x+bird.width && character.x+44 > bird.x && character.y < bird.y+bird.height && character.y+54 > bird.y) { triggerGameOver(); return; }
    }
  }

  // ============ ОТРИСОВКА ============
  function getEffectiveColors() {
    const ch = currentCharacter;
    if (!activeSkin) return { primary: ch.color, secondary: ch.secondary, belly: ch.belly, earInner: ch.earInner };
    return { primary: activeSkin.color, secondary: activeSkin.secondary, belly: activeSkin.belly || '#fff', earInner: activeSkin.earInner || '#ffab91', skin: activeSkin };
  }

  function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.fillStyle = score >= 40000 ? '#0d0d2b' : score >= 25000 ? '#1a1a1a' : '#fff';
    ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);
    if (score >= 40000) stars.forEach(s => {
      const twinkle = Math.sin(Date.now()*0.003+s.twinkle)*0.5+0.5;
      ctx.fillStyle = `rgba(255,255,255,${0.4+twinkle*0.6})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = score >= 40000 ? '#4a148c' : score >= 25000 ? '#f0f0f0' : '#1a1a1a';
    ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT-GROUND_Y);

    crystalsOnMap.forEach(cr => { ctx.fillStyle = '#00BCD4'; ctx.fillRect(cr.x, cr.y, cr.w, cr.h); ctx.fillStyle = '#fff'; ctx.fillRect(cr.x+3, cr.y+2, 4, 4); });
    obstacles.forEach(o => { ctx.fillStyle = '#2e7d32'; ctx.fillRect(o.x, o.y, o.width, o.height); ctx.fillStyle = '#4caf50'; ctx.fillRect(o.x+3, o.y+3, o.width-6, o.height-6); });
    birds.forEach(b => { ctx.fillStyle = '#7c4dff'; ctx.beginPath(); ctx.ellipse(b.x+b.width/2, b.y+b.height/2, b.width/3, b.height/3.5, 0, 0, Math.PI*2); ctx.fill(); });

    const { x, y } = character;
    const colors = getEffectiveColors();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x+22, y+50, 15, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.ellipse(x+22, y+30, 15, 19, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.belly; ctx.beginPath(); ctx.ellipse(x+22, y+32, 10, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.arc(x+31, y+14, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x+27, y+11, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+38, y+11, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+28, y+11, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+39, y+11, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.secondary; ctx.beginPath(); ctx.ellipse(x+10, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+26, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.arc(x+24, y+5, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+40, y+5, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors.earInner; ctx.beginPath(); ctx.arc(x+24, y+5, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+40, y+5, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = colors.primary; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x+5, y+40); ctx.quadraticCurveTo(x-8, y+32, x-5, y+20); ctx.stroke();

    ctx.fillStyle = score >= 25000 ? '#fff' : '#212121';
    ctx.font = 'bold 20px "Courier New"'; ctx.fillText(`${currentCharacter.name}: ${score}`, 20, 45);
    if (gameOver && !continueActive) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center';
      ctx.fillText('💀 КОНЕЦ ИГРЫ', CANVAS_WIDTH/2, CANVAS_HEIGHT/2); ctx.textAlign = 'left';
    }
  }

  function gameLoop() {
    update();
    draw();
    gameLoopId = requestAnimationFrame(gameLoop);
  }

  // ============ ОБРАБОТЧИКИ ============
  canvas.addEventListener('click', (e) => { e.preventDefault(); attemptJump(); });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); attemptJump(); });
  document.getElementById('pauseButton').addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
  document.getElementById('inGameMenuBtn').addEventListener('click', (e) => { e.stopPropagation(); openMenu('characters'); });
  document.getElementById('musicToggle').addEventListener('click', (e) => { e.stopPropagation(); });
  document.getElementById('continueYes').addEventListener('click', (e) => { e.stopPropagation(); continueGame(); });
  document.getElementById('continueNo').addEventListener('click', (e) => { e.stopPropagation(); 
    document.getElementById('continueOverlay').style.display = 'none';
    document.getElementById('restartHint').style.display = 'block';
    continueActive = false;
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); attemptJump(); }
    if (e.key === 'Escape') { e.preventDefault(); if (menuOpen) closeMenu(); else togglePause(); }
  });

  function startGame() {
    loadFriends();
    updateUI();
    resetGame();
    gameLoop();
  }

  // ЗАПУСК
  showAuth();
  setInterval(() => { if (isAuthenticated) saveToCloud(); }, 30000);
});
</script>
</body>
</html>
