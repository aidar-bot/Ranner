<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
  <title>Раннер • Firebase</title>
  <style>
    /* Все стили остаются без изменений */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation; user-select: none;
    }
    .game-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .game-container {
      position: relative; background-color: #f7f7f7; border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; width: 100%; max-width: 800px;
    }
    canvas { display: block; width: 100%; height: auto; background-color: #fff; cursor: pointer; }
    .record-panel {
      position: absolute; top: 12px; right: 20px; background: rgba(0,0,0,0.7);
      color: #fdd835; padding: 8px 18px; border-radius: 40px; font-weight: bold; font-size: 1.2rem;
      z-index: 10; pointer-events: none;
    }
    .music-toggle, .pause-button {
      position: absolute; top: 12px; background: rgba(0,0,0,0.7); color: white;
      border-radius: 40px; padding: 8px 14px; font-weight: bold; font-size: 1.1rem; cursor: pointer; z-index: 20;
      font-family: 'Courier New', monospace; border: 1px solid rgba(255,255,255,0.25);
    }
    .music-toggle { left: 20px; }
    .pause-button { left: 50%; transform: translateX(-50%); }
    .restart-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #ddd; padding: 6px 18px; border-radius: 20px;
      font-size: 0.9rem; z-index: 10; pointer-events: none; display: none;
    }
    .continue-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 25; display: none;
    }
    .continue-panel {
      background: #1e1e2e; border: 2px solid #fdd835; border-radius: 20px;
      padding: 20px 30px; text-align: center; color: white;
    }
    .continue-panel h3 { color: #fdd835; margin-bottom: 10px; }
    .timer { font-size: 2rem; color: #ff5252; font-weight: bold; margin: 15px 0; }
    .continue-buttons { display: flex; gap: 15px; justify-content: center; }
    .continue-btn, .decline-btn { padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; border: none; color: white; }
    .continue-btn { background: #4caf50; }
    .decline-btn { background: #f44336; }
    .in-game-menu-btn {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fdd835; border-radius: 40px; padding: 8px 18px;
      font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 20; display: none;
      font-family: 'Courier New', monospace; border: 1px solid rgba(255,255,255,0.25);
    }
    .menu-overlay, .auth-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center;
      align-items: center; z-index: 30; border-radius: 24px;
    }
    .auth-overlay { z-index: 40; background: rgba(0,0,0,0.95); }
    .menu-panel, .auth-panel {
      background: #1e1e2e; border: 2px solid #555; border-radius: 24px; padding: 20px;
      width: 90%; max-width: 600px; color: white; text-align: center;
      max-height: 80vh; overflow-y: auto;
    }
    .auth-panel { max-width: 400px; border-color: #fdd835; }
    .menu-panel h2, .auth-panel h2 { margin-bottom: 15px; font-size: 1.8rem; color: #fdd835; }
    .currencies-menu { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; font-weight: bold; }
    .crystals { color: #80d8ff; }
    .cryptostals { color: #ff80ab; }
    .menu-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .menu-tab { background: #333; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.8rem; }
    .menu-tab.active { background: #fdd835; color: #222; }
    .menu-content { text-align: left; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: #333; border-radius: 16px; padding: 10px; cursor: pointer; border: 2px solid transparent; text-align: center; }
    .card.selected { border-color: #fdd835; }
    .card:hover { background: #444; }
    .preview { width: 50px; height: 50px; margin: 0 auto 6px; border-radius: 10px; }
    .card-name { font-weight: bold; font-size: 0.8rem; }
    .btn { background: #fdd835; color: #222; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; }
    .close-btn { margin-top: 20px; }
    .auth-input {
      background: #333; border: 2px solid #555; color: white; padding: 12px;
      border-radius: 12px; font-size: 1.1rem; text-align: center; font-family: 'Courier New', monospace;
      width: 100%; margin: 8px 0;
    }
    .auth-input:focus { outline: none; border-color: #fdd835; }
    .auth-label { display: block; text-align: left; margin-top: 10px; color: #aaa; font-size: 0.9rem; }
    .auth-message { margin: 10px 0; padding: 10px; border-radius: 12px; font-weight: bold; display: none; }
    .auth-message.error { background: #b71c1c; color: #ef9a9a; display: block; }
    .auth-message.success { background: #1b5e20; color: #81c784; display: block; }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.75rem; }
    .leaderboard-table th { background: #333; padding: 8px; text-align: left; }
    .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; }
    .chat-box { background: #111; border-radius: 12px; padding: 10px; max-height: 180px; overflow-y: auto; margin: 10px 0; text-align: left; }
    .chat-msg { margin: 4px 0; font-size: 0.78rem; }
    .chat-msg .sender { color: #fdd835; font-weight: bold; }
    .friend-item { background: #2a2a3a; padding: 8px 12px; border-radius: 8px; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button class="music-toggle" id="musicToggle">🔊</button>
    <div class="record-panel">🏆 <span id="recordDisplay">0</span></div>
    <button class="pause-button" id="pauseButton">⏸️ Пауза</button>
    <button class="in-game-menu-btn" id="inGameMenuBtn">🏠 Меню</button>
    <div class="restart-hint" id="restartHint">🔄 Коснитесь / Пробел для рестарта</div>
    <div class="continue-overlay" id="continueOverlay">
      <div class="continue-panel">
        <h3>💀 Вы проиграли!</h3>
        <p>Продолжить за 💎100?</p>
        <div class="timer" id="continueTimer">8</div>
        <div class="continue-buttons">
          <button class="continue-btn" id="continueYes">✅ Да</button>
          <button class="decline-btn" id="continueNo">❌ Нет</button>
        </div>
      </div>
    </div>
    <div class="auth-overlay" id="authOverlay" style="display:flex;">
      <div class="auth-panel" id="authPanel"></div>
    </div>
    <div class="menu-overlay" id="menuOverlay" style="display:none;">
      <div class="menu-panel" id="menuPanel"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzSkne1P83HnZuDLboLBBHC2dK1RDiuhM",
    authDomain: "runnerr-20f52.firebaseapp.com",
    databaseURL: "https://runnerr-20f52-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "runnerr-20f52",
    storageBucket: "runnerr-20f52.firebasestorage.app",
    messagingSenderId: "133710015550",
    appId: "1:133710015550:web:bcbf049afd31578a74b56f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  console.log('🔥 Firebase подключен! Ожидание готовности DOM...');

  // Ждём полной загрузки DOM перед инициализацией
  function waitForDOM() {
    return new Promise((resolve) => {
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        resolve();
      } else {
        document.addEventListener('DOMContentLoaded', resolve);
      }
    });
  }

  async function initApp() {
    await waitForDOM();
    console.log('✅ DOM готов! Инициализация игры...');

    // ============ DOM ЭЛЕМЕНТЫ ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const recordDisplay = document.getElementById('recordDisplay');
    const restartHint = document.getElementById('restartHint');
    const pauseButton = document.getElementById('pauseButton');
    const inGameMenuBtn = document.getElementById('inGameMenuBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuPanel = document.getElementById('menuPanel');
    const musicToggle = document.getElementById('musicToggle');
    const continueOverlay = document.getElementById('continueOverlay');
    const continueTimer = document.getElementById('continueTimer');
    const continueYes = document.getElementById('continueYes');
    const continueNo = document.getElementById('continueNo');
    const authOverlay = document.getElementById('authOverlay');
    const authPanel = document.getElementById('authPanel');

    // Делаем canvas не перехватывающим фокус у input-полей
    canvas.addEventListener('mousedown', function(e) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        e.stopPropagation();
      }
    });

    // ============ КОНСТАНТЫ ============
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const GROUND_Y = 320;

    // ============ ПЕРЕМЕННЫЕ ИГРЫ ============
    let gameOver = false, paused = false, menuOpen = false, continueActive = false;
    let continueSeconds = 8, continueInterval = null;
    let score = 0, highScore = 0, crystals = 0, cryptostals = 0;
    let passXP = 0, passLevel = 1;
    let lastPassReset = '';
    let stats = { jumps: 0, deaths: 0, crystalsCollected: 0, totalScore: 0 };
    let baseSpeed = 6.5, currentSpeed = baseSpeed;
    let spawnTimer = 0, nextSpawnIn = 70;
    let obstacles = [], birds = [], crystalsOnMap = [], fireworks = [];
    let audioCtx = null, musicPlaying = false;
    let lootboxReady = false, lastLootboxDay = '';
    let gameLoopId = null;
    let speedBoostActive = false, speedBoostTimer = 0;
    let doubleCrystalsActive = false, doubleCrystalsTimer = 0;

    let character = { x: 120, y: GROUND_Y - 54, width: 44, height: 54, vy: 0, gravity: 0.8, grounded: true };

    let stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * CANVAS_WIDTH, y: Math.random() * GROUND_Y * 0.7, size: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2 });
    }

    // ============ АККАУНТ СИСТЕМА ============
    let playerId = localStorage.getItem('runnerPlayerId');
    let codeWord = localStorage.getItem('runnerCodeWord');
    let isAuthenticated = false;

    function generatePlayerId() {
      return 'RNR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function generateCodeWord() {
      const words = ['Fire', 'Star', 'Moon', 'Wind', 'Wolf', 'Bear', 'Fox', 'Lion', 'Eagle', 'Hawk', 'Jade', 'Ruby', 'Gold', 'Iron', 'Steel', 'Storm', 'Frost', 'Blaze', 'Shadow', 'Light'];
      return words[Math.floor(Math.random() * words.length)] + Math.floor(Math.random() * 1000);
    }

    function verifyLogin(id, word, callback) {
      get(ref(db, 'accounts/' + id)).then(snapshot => {
        if (snapshot.exists() && snapshot.val().codeWord === word) {
          callback(true);
        } else {
          callback(false);
        }
      }).catch(() => callback(false));
    }

    function showAuth() {
      console.log('Показываем экран авторизации...');
      console.log('playerId из localStorage:', playerId);
      authOverlay.style.display = 'flex';
      
      if (playerId && codeWord) {
        console.log('Найдены сохранённые данные, пробуем авто-вход...');
        verifyLogin(playerId, codeWord, (success) => {
          if (success) {
            console.log('Авто-вход успешен!');
            authOverlay.style.display = 'none';
            isAuthenticated = true;
            loadGameData();
            loadFriends();
            startGame();
          } else {
            console.log('Авто-вход не удался, показываем меню');
            renderAuthScreen('main');
          }
        });
      } else {
        console.log('Нет сохранённых данных, показываем меню');
        renderAuthScreen('main');
      }
    }

    function renderAuthScreen(screen) {
      console.log('Рендерим экран:', screen);
      authOverlay.style.display = 'flex';
      
      if (screen === 'main') {
        authPanel.innerHTML = `
          <h2>🎮 Раннер</h2>
          <p style="color:#aaa;margin-bottom:20px;">Добро пожаловать в игру!</p>
          <button class="btn" id="btnRegister" style="width:100%;margin:10px 0;padding:15px;">📝 Регистрация</button>
          <button class="btn" id="btnLogin" style="width:100%;margin:10px 0;padding:15px;background:#2196f3;color:white;">🔑 Вход</button>
          <button class="btn" id="btnPlayLocal" style="width:100%;margin:10px 0;padding:15px;background:#666;color:white;">💾 Играть локально</button>
        `;
        
        setTimeout(() => {
          document.getElementById('btnRegister').addEventListener('click', () => renderAuthScreen('register'));
          document.getElementById('btnLogin').addEventListener('click', () => renderAuthScreen('login'));
          document.getElementById('btnPlayLocal').addEventListener('click', () => {
            playerId = 'local_' + Date.now().toString(36);
            codeWord = 'local';
            authOverlay.style.display = 'none';
            isAuthenticated = true;
            loadFromLocal();
            startGame();
          });
        }, 100);
      } else if (screen === 'register') {
        const newId = generatePlayerId();
        const newWord = generateCodeWord();
        authPanel.innerHTML = `
          <h2>📝 Регистрация</h2>
          <div style="background:#1b5e20;padding:15px;border-radius:12px;margin:15px 0;text-align:left;">
            <p><strong>Ваш ID:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newId}</span></p>
            <p><strong>Кодовое слово:</strong> <span style="color:#ffd700;font-size:1.2rem;">${newWord}</span></p>
            <p style="color:#ff9800;font-size:0.8rem;margin-top:10px;">⚠️ Сохраните эти данные! Они нужны для входа с других устройств.</p>
          </div>
          <button class="btn" id="btnConfirmRegister" style="width:100%;padding:15px;">✅ Я сохранил(а)</button>
          <button class="btn" id="btnBack" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
        `;
        
        setTimeout(() => {
          document.getElementById('btnConfirmRegister').addEventListener('click', () => {
            set(ref(db, 'accounts/' + newId), { codeWord: newWord, createdAt: Date.now() })
              .then(() => {
                playerId = newId;
                codeWord = newWord;
                localStorage.setItem('runnerPlayerId', playerId);
                localStorage.setItem('runnerCodeWord', codeWord);
                authOverlay.style.display = 'none';
                isAuthenticated = true;
                loadGameData();
                loadFriends();
                startGame();
              })
              .catch(err => {
                console.error('Ошибка регистрации:', err);
                alert('Ошибка регистрации. Проверьте подключение к интернету.');
              });
          });
          document.getElementById('btnBack').addEventListener('click', () => renderAuthScreen('main'));
        }, 100);
      } else if (screen === 'login') {
        authPanel.innerHTML = `
          <h2>🔑 Вход</h2>
          <label class="auth-label">ID:</label>
          <input type="text" class="auth-input" id="loginId" placeholder="RNR-XXXXXX" autocomplete="off" style="user-select:text;-webkit-user-select:text;">
          <label class="auth-label">Кодовое слово:</label>
          <input type="text" class="auth-input" id="loginWord" placeholder="Ваше кодовое слово" autocomplete="off" style="user-select:text;-webkit-user-select:text;">
          <div class="auth-message" id="authMessage"></div>
          <button class="btn" id="btnConfirmLogin" style="width:100%;padding:15px;margin-top:10px;">Войти</button>
          <button class="btn" id="btnBack2" style="width:100%;margin-top:10px;background:#666;color:white;">Назад</button>
        `;
        
        setTimeout(() => {
          const loginIdInput = document.getElementById('loginId');
          const loginWordInput = document.getElementById('loginWord');
          const msgDiv = document.getElementById('authMessage');
          
          // Предотвращаем всплытие событий ввода
          [loginIdInput, loginWordInput].forEach(input => {
            input.addEventListener('mousedown', (e) => e.stopPropagation());
            input.addEventListener('touchstart', (e) => e.stopPropagation());
            input.addEventListener('click', (e) => e.stopPropagation());
          });
          
          document.getElementById('btnConfirmLogin').addEventListener('click', () => {
            const id = loginIdInput.value.trim();
            const word = loginWordInput.value.trim();
            
            if (!id || !word) {
              msgDiv.className = 'auth-message error';
              msgDiv.textContent = 'Заполните все поля!';
              return;
            }
            
            verifyLogin(id, word, (success) => {
              if (success) {
                playerId = id;
                codeWord = word;
                localStorage.setItem('runnerPlayerId', playerId);
                localStorage.setItem('runnerCodeWord', codeWord);
                authOverlay.style.display = 'none';
                isAuthenticated = true;
                loadGameData();
                loadFriends();
                startGame();
              } else {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = 'Неверный ID или кодовое слово!';
              }
            });
          });
          
          document.getElementById('btnBack2').addEventListener('click', () => renderAuthScreen('main'));
          
          // Фокус на первое поле
          setTimeout(() => loginIdInput.focus(), 200);
        }, 100);
      }
    }

    // ============ ПЕРСОНАЖИ ============
    const CHARACTERS = {
      LEO: { id: 'leo', name: 'Лео', type: 'animal', color: '#ff9800', secondary: '#e65100', belly: '#ffcc80', earInner: '#ffab91', hasMane: true, maneColor: '#ff6d00', earShape: 'round', tailType: 'long' },
      DINO: { id: 'dino', name: 'Дино', type: 'animal', color: '#4caf50', secondary: '#2e7d32', belly: '#a5d6a7', earInner: '#81c784', hasSpikes: true, spikeColor: '#1b5e20', earShape: 'spikes', tailType: 'short_thick' },
      CAT: { id: 'cat', name: 'Котик', type: 'animal', color: '#9e9e9e', secondary: '#616161', belly: '#e0e0e0', earInner: '#f48fb1', hasWhiskers: true, earShape: 'pointy', tailType: 'curly' },
      DOG: { id: 'dog', name: 'Собачка', type: 'animal', color: '#8d6e63', secondary: '#5d4037', belly: '#d7ccc8', earInner: '#bcaaa4', hasTongue: true, earShape: 'floppy', tailType: 'waggy' },
      PANTHER: { id: 'panther', name: 'Пантера', type: 'animal', color: '#1a1a1a', secondary: '#333', belly: '#2a2a2a', earInner: '#444', hasTeeth: true, elongated: true, earShape: 'small_round', tailType: 'long_sleek' },
      BEAR: { id: 'bear', name: 'Медвежонок', type: 'animal', color: '#8d6e63', secondary: '#5d4037', belly: '#d7ccc8', earInner: '#bcaaa4', chubby: true, hasClaws: true, earShape: 'small_round', tailType: 'tiny' },
      FOX: { id: 'fox', name: 'Лис', type: 'animal', color: '#ff6d00', secondary: '#bf360c', belly: '#ffcc80', earInner: '#fff', pointyNose: true, hasWhiteTips: true, earShape: 'pointy_tall', tailType: 'bushy' },
      RABBIT: { id: 'rabbit', name: 'Кролик', type: 'animal', color: '#f5f5f5', secondary: '#e0e0e0', belly: '#fff', earInner: '#ff80ab', jumpBonus: true, hasFluffyTail: true, earShape: 'long_ears', tailType: 'fluffy_ball' }
    };

    let currentCharacter = CHARACTERS.LEO;
    let ownedCharacters = new Set(['leo', 'dino', 'cat', 'dog', 'panther', 'bear', 'fox', 'rabbit']);

    const ALL_SKINS = {
      GOLDEN: { id: 'golden', name: 'Золотой', price: 1500, color: '#ffd700', secondary: '#b8860b', belly: '#fff176', earInner: '#ffec80', currency: 'crystals' },
      COSMIC: { id: 'cosmic', name: 'Космический', price: 10000, color: '#7c4dff', secondary: '#651fff', belly: '#b388ff', earInner: '#d1c4e9', currency: 'crystals' },
      FLAME: { id: 'flame', name: 'Пламенный', price: 5000, color: '#ff6d00', secondary: '#d50000', belly: '#ffab40', earInner: '#ff5252', flame: true, currency: 'cryptostals' },
      NEON: { id: 'neon', name: 'Неоновый', price: 8000, color: '#00ff88', secondary: '#00cc66', belly: '#ccffcc', earInner: '#66ff99', neon: true, currency: 'cryptostals' }
    };

    let activeSkin = null;
    let ownedSkins = new Set();

    const PROMOCODES = {
      'GOLDEN2026': { reward: { type: 'skin', skinId: 'golden' }, oneTime: true },
      'KOSMOMAY': { reward: { type: 'skin', skinId: 'cosmic' }, oneTime: true },
      'KRIPT2026': { reward: { type: 'cryptostals', amount: 5000 }, oneTime: true },
      'KRISTMAY': { reward: { type: 'crystals', amount: 12000 }, oneTime: true },
      'FAILPRISE': { reward: { type: 'combo', skinId: 'flame', crystals: 3000 }, oneTime: true },
      'NEONLIFE': { reward: { type: 'skin', skinId: 'neon' }, oneTime: true }
    };
    let usedPromocodes = new Set();

    let dailyQuests = [], dailyClaimed = [false,false,false,false];
    let lastDailyReset = '';

    // ============ FIREBASE ФУНКЦИИ ============
    function saveToCloud() {
      if (!isAuthenticated || !playerId || playerId.startsWith('local_')) return;
      const data = {
        codeWord, highScore, crystals, cryptostals, passXP, passLevel,
        character: currentCharacter.id,
        activeSkin: activeSkin ? activeSkin.id : '',
        ownedSkins: [...ownedSkins],
        ownedCharacters: [...ownedCharacters],
        usedPromocodes: [...usedPromocodes],
        stats, lastLootboxDay,
        lastUpdated: Date.now()
      };
      set(ref(db, 'accounts/' + playerId), data).catch(err => console.error('Save error:', err));
    }

    function loadGameData() {
      if (!isAuthenticated || !playerId || playerId.startsWith('local_')) return;
      get(ref(db, 'accounts/' + playerId)).then(snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          highScore = data.highScore || 0;
          crystals = data.crystals || 0;
          cryptostals = data.cryptostals || 0;
          passXP = data.passXP || 0;
          passLevel = data.passLevel || 1;
          currentCharacter = Object.values(CHARACTERS).find(c => c.id === data.character) || CHARACTERS.LEO;
          activeSkin = data.activeSkin ? (ALL_SKINS[data.activeSkin.toUpperCase()] || null) : null;
          ownedSkins = new Set(data.ownedSkins || []);
          ownedCharacters = new Set(data.ownedCharacters || ['leo','dino','cat','dog','panther','bear','fox','rabbit']);
          usedPromocodes = new Set(data.usedPromocodes || []);
          stats = data.stats || { jumps: 0, deaths: 0, crystalsCollected: 0, totalScore: 0 };
          lastLootboxDay = data.lastLootboxDay || '';
          lootboxReady = lastLootboxDay !== new Date().toDateString();
        }
      });
    }

    function submitScore() {
      if (!isAuthenticated || !playerId || highScore === 0) return;
      push(ref(db, 'leaderboard'), {
        playerId: playerId.substring(0, 8),
        name: currentCharacter.name,
        score: highScore,
        timestamp: Date.now()
      });
    }

    let friends = [];
    function loadFriends() {
      if (!isAuthenticated || playerId.startsWith('local_')) return;
      get(ref(db, 'accounts/' + playerId + '/friends')).then(snapshot => {
        if (snapshot.exists()) friends = snapshot.val() || [];
      });
    }

    // ============ ЛОКАЛЬНОЕ СОХРАНЕНИЕ ============
    function saveToLocal() {
      try {
        localStorage.setItem('runnerHighScore', highScore);
        localStorage.setItem('runnerCrystals', crystals);
        localStorage.setItem('runnerCryptostals', cryptostals);
        localStorage.setItem('runnerOwnedSkins', JSON.stringify([...ownedSkins]));
        localStorage.setItem('runnerOwnedCharacters', JSON.stringify([...ownedCharacters]));
        localStorage.setItem('runnerUsedPromocodes', JSON.stringify([...usedPromocodes]));
        localStorage.setItem('runnerCharacter', currentCharacter.id);
        localStorage.setItem('runnerActiveSkin', activeSkin ? activeSkin.id : '');
        localStorage.setItem('runnerStats', JSON.stringify(stats));
        localStorage.setItem('runnerLootboxDay', lastLootboxDay);
      } catch(e) {}
    }

    function loadFromLocal() {
      try {
        highScore = parseInt(localStorage.getItem('runnerHighScore')) || 0;
        crystals = parseInt(localStorage.getItem('runnerCrystals')) || 0;
        cryptostals = parseInt(localStorage.getItem('runnerCryptostals')) || 0;
        ownedSkins = new Set(JSON.parse(localStorage.getItem('runnerOwnedSkins') || '[]'));
        ownedCharacters = new Set(JSON.parse(localStorage.getItem('runnerOwnedCharacters') || '["leo","dino","cat","dog","panther","bear","fox","rabbit"]'));
        usedPromocodes = new Set(JSON.parse(localStorage.getItem('runnerUsedPromocodes') || '[]'));
        const charId = localStorage.getItem('runnerCharacter');
        currentCharacter = Object.values(CHARACTERS).find(c => c.id === charId) || CHARACTERS.LEO;
        const skinId = localStorage.getItem('runnerActiveSkin');
        activeSkin = skinId ? (ALL_SKINS[skinId.toUpperCase()] || null) : null;
        stats = JSON.parse(localStorage.getItem('runnerStats') || '{"jumps":0,"deaths":0,"crystalsCollected":0,"totalScore":0}');
        lastLootboxDay = localStorage.getItem('runnerLootboxDay') || '';
        lootboxReady = lastLootboxDay !== new Date().toDateString();
      } catch(e) {}
    }

    function saveData() { saveToLocal(); }
    function updateUI() { recordDisplay.textContent = highScore; }

    // ============ ИГРОВЫЕ ФУНКЦИИ ============
    function generateDailyQuests() {
      const t = [{ desc: 'Дойди до 3000', target: 3000 }, { desc: 'Дойди до 5000', target: 5000 }, { desc: 'Дойди до 8000', target: 8000 }, { desc: 'Дойди до 10000', target: 10000 }];
      dailyQuests = [];
      const u = new Set();
      while (dailyQuests.length < 4) { const q = t[Math.floor(Math.random()*t.length)]; if (!u.has(q.desc)) { u.add(q.desc); dailyQuests.push({...q}); } }
      dailyClaimed = [false,false,false,false];
    }

    function checkQuestCompletion() {
      dailyQuests.forEach((q,i) => { if (!dailyClaimed[i] && score >= q.target) { dailyClaimed[i] = true; crystals += 500; saveData(); } });
    }

    function resetGame() {
      character.y = GROUND_Y - 54; character.vy = 0; character.grounded = true;
      obstacles = []; birds = []; crystalsOnMap = [];
      spawnTimer = 0; nextSpawnIn = 70 + Math.floor(Math.random()*60);
      score = 0; currentSpeed = baseSpeed;
      gameOver = false; paused = false; continueActive = false;
      restartHint.style.display = 'none'; continueOverlay.style.display = 'none';
      if (continueInterval) clearInterval(continueInterval);
      inGameMenuBtn.style.display = 'none';
      pauseButton.textContent = '⏸️ Пауза'; pauseButton.style.display = 'block';
      speedBoostActive = false; doubleCrystalsActive = false;
      fireworks = [];
    }

    function triggerGameOver() {
      gameOver = true; stats.deaths++;
      if (score > highScore) { highScore = score; submitScore(); }
      saveData(); saveToCloud();
      if (crystals >= 100) {
        continueActive = true; continueOverlay.style.display = 'flex';
        continueSeconds = 8; continueTimer.textContent = '8';
        restartHint.style.display = 'none'; pauseButton.style.display = 'none';
        continueInterval = setInterval(() => {
          continueSeconds--; continueTimer.textContent = continueSeconds;
          if (continueSeconds <= 0) { clearInterval(continueInterval); continueActive = false; continueOverlay.style.display = 'none'; restartHint.style.display = 'block'; }
        }, 1000);
      } else { restartHint.style.display = 'block'; }
    }

    function continueGame() {
      if (!continueActive || crystals < 100) return;
      crystals -= 100; continueActive = false; continueOverlay.style.display = 'none';
      if (continueInterval) clearInterval(continueInterval);
      gameOver = false; character.y = GROUND_Y - 54; character.vy = 0; character.grounded = true;
      obstacles = obstacles.filter(o => o.x > 180); birds = birds.filter(b => b.x > 180);
      saveData(); updateUI(); pauseButton.style.display = 'block';
    }

    function declineContinue() {
      continueActive = false; continueOverlay.style.display = 'none';
      if (continueInterval) clearInterval(continueInterval);
      restartHint.style.display = 'block'; pauseButton.style.display = 'block';
    }

    function attemptJump() {
      if (continueActive || menuOpen) return;
      if (gameOver) { resetGame(); return; }
      if (paused) { paused = false; pauseButton.textContent = '⏸️ Пауза'; inGameMenuBtn.style.display = 'none'; return; }
      if (character.grounded) { character.vy = currentCharacter.jumpBonus ? -16 : -14; character.grounded = false; stats.jumps++; }
    }

    function togglePause() {
      if (continueActive || menuOpen) return;
      if (gameOver) { resetGame(); return; }
      paused = !paused;
      pauseButton.textContent = paused ? '▶️ Играть' : '⏸️ Пауза';
      inGameMenuBtn.style.display = paused ? 'block' : 'none';
    }

    function openMenu() {
      if (continueActive) return;
      menuOpen = true; paused = true;
      menuOverlay.style.display = 'flex';
      pauseButton.style.display = 'none'; inGameMenuBtn.style.display = 'none';
      renderMenu('characters');
    }

    function closeMenu() {
      menuOpen = false; paused = false;
      menuOverlay.style.display = 'none';
      pauseButton.style.display = 'block';
    }

    function renderMenu(tab) {
      menuPanel.innerHTML = `
        <h2>🏠 Меню</h2>
        <p style="font-size:0.7rem;color:#aaa;">ID: ${playerId ? playerId.substring(0,12) : 'Нет'}</p>
        <div class="currencies-menu"><span class="crystals">💎 ${crystals}</span><span class="cryptostals">🔮 ${cryptostals}</span></div>
        <div class="menu-tabs">
          <button class="menu-tab ${tab==='characters'?'active':''}" data-tab="characters">🐾</button>
          <button class="menu-tab ${tab==='shop'?'active':''}" data-tab="shop">🛒</button>
          <button class="menu-tab ${tab==='skins'?'active':''}" data-tab="skins">🎨</button>
          <button class="menu-tab ${tab==='leaderboard'?'active':''}" data-tab="leaderboard">🏆</button>
          <button class="menu-tab ${tab==='promo'?'active':''}" data-tab="promo" style="background:#ff9800;">🎫</button>
        </div>
        <div class="menu-content" id="menuContent"></div>
        <button class="btn close-btn" id="closeMenuBtn">Играть</button>
      `;
      document.getElementById('closeMenuBtn').addEventListener('click', closeMenu);
      menuPanel.querySelectorAll('.menu-tab').forEach(btn => {
        btn.addEventListener('click', () => renderMenu(btn.dataset.tab));
      });
      const c = document.getElementById('menuContent');
      if (tab === 'characters') renderCharacters(c);
      else if (tab === 'shop') renderShop(c);
      else if (tab === 'skins') renderSkins(c);
      else if (tab === 'leaderboard') renderLeaderboard(c);
      else if (tab === 'promo') renderPromo(c);
    }

    function renderCharacters(c) {
      c.innerHTML = '<div class="grid"></div>';
      const g = c.querySelector('.grid');
      Object.values(CHARACTERS).forEach(ch => {
        if (!ownedCharacters.has(ch.id)) return;
        const card = document.createElement('div');
        card.className = 'card' + (currentCharacter.id === ch.id ? ' selected' : '');
        card.innerHTML = `<div class="preview" style="background:${ch.color};"></div><div class="card-name">${ch.name}</div>`;
        card.addEventListener('click', () => { currentCharacter = ch; saveData(); renderMenu('characters'); });
        g.appendChild(card);
      });
    }

    function renderShop(c) {
      c.innerHTML = '<div class="grid"></div>';
      const g = c.querySelector('.grid');
      Object.values(ALL_SKINS).forEach(s => {
        if (ownedSkins.has(s.id) || !s.price) return;
        const card = document.createElement('div');
        card.className = 'card';
        const sym = s.currency === 'cryptostals' ? '🔮' : '💎';
        card.innerHTML = `<div class="preview" style="background:${s.flame?'linear-gradient(#ffd600,#d50000)':s.color};"></div><div class="card-name">${s.name}</div><div class="card-price">${sym} ${s.price}</div>`;
        card.addEventListener('click', () => {
          if (s.currency === 'cryptostals' && cryptostals >= s.price) { cryptostals -= s.price; ownedSkins.add(s.id); saveData(); renderMenu('shop'); }
          else if (s.currency === 'crystals' && crystals >= s.price) { crystals -= s.price; ownedSkins.add(s.id); saveData(); renderMenu('shop'); }
        });
        g.appendChild(card);
      });
    }

    function renderSkins(c) {
      const avail = Object.values(ALL_SKINS).filter(s => ownedSkins.has(s.id));
      c.innerHTML = '<div class="grid"></div>';
      const g = c.querySelector('.grid');
      const none = document.createElement('div');
      none.className = 'card' + (!activeSkin ? ' selected' : '');
      none.innerHTML = `<div class="preview" style="background:${currentCharacter.color};"></div><div class="card-name">Стандартный</div>`;
      none.addEventListener('click', () => { activeSkin = null; saveData(); renderMenu('skins'); });
      g.appendChild(none);
      avail.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card' + (activeSkin?.id === s.id ? ' selected' : '');
        card.innerHTML = `<div class="preview" style="background:${s.flame?'linear-gradient(#ffd600,#d50000)':s.color};"></div><div class="card-name">${s.name}</div>`;
        card.addEventListener('click', () => { activeSkin = s; saveData(); renderMenu('skins'); });
        g.appendChild(card);
      });
    }

    function renderLeaderboard(c) {
      c.innerHTML = '<h3>🏆 Топ-10</h3><table class="leaderboard-table"><tr><th>#</th><th>ID</th><th>Счёт</th></tr><tbody id="lbBody"></tbody></table>';
      get(ref(db, 'leaderboard')).then(snapshot => {
        if (snapshot.exists()) {
          const data = Object.values(snapshot.val());
          data.sort((a,b) => b.score - a.score);
          const tbody = document.getElementById('lbBody');
          data.slice(0, 10).forEach((e, i) => {
            const row = tbody.insertRow();
            row.innerHTML = `<td>${i+1}</td><td>${e.playerId||'???'}</td><td>${e.score}</td>`;
          });
        }
      });
    }

    function renderPromo(c) {
      c.innerHTML = `
        <h3>🎫 Промокоды</h3>
        <input type="text" class="auth-input" id="promoInput" placeholder="Введите промокод" autocomplete="off" style="user-select:text;">
        <button class="btn" id="activatePromoBtn" style="background:#ff9800;margin:10px 0;">Активировать</button>
        <div class="promo-message" id="promoMessage"></div>
        <p style="font-size:0.7rem;">GOLDEN2026 | KOSMOMAY | KRIPT2026 | KRISTMAY | FAILPRISE | NEONLIFE</p>
      `;
      setTimeout(() => {
        const input = document.getElementById('promoInput');
        input.addEventListener('mousedown', e => e.stopPropagation());
        input.addEventListener('touchstart', e => e.stopPropagation());
        document.getElementById('activatePromoBtn').addEventListener('click', () => {
          const code = input.value.toUpperCase().trim();
          const promo = PROMOCODES[code];
          const msg = document.getElementById('promoMessage');
          if (!promo) { msg.className = 'auth-message error'; msg.textContent = 'Неверный код!'; return; }
          if (promo.oneTime && usedPromocodes.has(code)) { msg.className = 'auth-message error'; msg.textContent = 'Уже использован!'; return; }
          if (promo.reward.type === 'skin') {
            if (ownedSkins.has(promo.reward.skinId)) { msg.className = 'auth-message error'; msg.textContent = 'Скин уже есть!'; return; }
            ownedSkins.add(promo.reward.skinId);
          } else if (promo.reward.type === 'crystals') crystals += promo.reward.amount;
          else if (promo.reward.type === 'cryptostals') cryptostals += promo.reward.amount;
          else if (promo.reward.type === 'combo') { ownedSkins.add(promo.reward.skinId); crystals += promo.reward.crystals; }
          usedPromocodes.add(code);
          saveData(); saveToCloud();
          msg.className = 'auth-message success'; msg.textContent = '✅ Активирован!';
        });
      }, 100);
    }

    function update() {
      if (gameOver || paused || menuOpen || continueActive) return;
      if (!character.grounded) { character.vy += character.gravity; character.y += character.vy; if (character.y >= GROUND_Y-54) { character.y = GROUND_Y-54; character.vy = 0; character.grounded = true; } }
      currentSpeed = baseSpeed * (1 + Math.floor(score/5000)*0.3);
      spawnTimer++; if (spawnTimer >= nextSpawnIn) { spawnTimer = 0; nextSpawnIn = 70+Math.floor(Math.random()*60); obstacles.push({ x: CANVAS_WIDTH, y: GROUND_Y-(40+Math.random()*25), width: 30, height: 40+Math.random()*25 }); }
      if (Math.random() < 0.008) crystalsOnMap.push({ x: CANVAS_WIDTH, y: GROUND_Y-30-Math.random()*100, w: 15, h: 15 });
      for (let i = obstacles.length-1; i>=0; i--) { obstacles[i].x -= currentSpeed; if (obstacles[i].x < -50) obstacles.splice(i,1); }
      for (let i = crystalsOnMap.length-1; i>=0; i--) { crystalsOnMap[i].x -= currentSpeed; if (crystalsOnMap[i].x < -50) crystalsOnMap.splice(i,1); }
      for (let i = crystalsOnMap.length-1; i>=0; i--) {
        const cr = crystalsOnMap[i];
        if (character.x < cr.x+cr.w && character.x+44 > cr.x && character.y < cr.y+cr.h && character.y+54 > cr.y) { crystals += 5; stats.crystalsCollected += 5; crystalsOnMap.splice(i,1); }
      }
      score += Math.floor(currentSpeed*0.7); stats.totalScore += Math.floor(currentSpeed*0.7);
      if (score > highScore) { highScore = score; updateUI(); }
      checkQuestCompletion();
      for (const obs of obstacles) { if (character.x < obs.x+obs.width && character.x+44 > obs.x && character.y < obs.y+obs.height && character.y+54 > obs.y) { triggerGameOver(); return; } }
    }

    function getEffectiveColors() {
      const ch = currentCharacter;
      if (!activeSkin) return { primary: ch.color, secondary: ch.secondary, belly: ch.belly, earInner: ch.earInner };
      return { primary: activeSkin.color, secondary: activeSkin.secondary, belly: activeSkin.belly||'#fff', earInner: activeSkin.earInner||'#ffab91', skin: activeSkin };
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = score >= 25000 ? '#1a1a1a' : '#fff';
      ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);
      ctx.fillStyle = score >= 25000 ? '#f0f0f0' : '#1a1a1a';
      ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT-GROUND_Y);
      crystalsOnMap.forEach(cr => { ctx.fillStyle = '#00BCD4'; ctx.fillRect(cr.x, cr.y, cr.w, cr.h); });
      obstacles.forEach(o => { ctx.fillStyle = '#2e7d32'; ctx.fillRect(o.x, o.y, o.width, o.height); ctx.fillStyle = '#4caf50'; ctx.fillRect(o.x+3, o.y+3, o.width-6, o.height-6); });
      
      const { x, y } = character;
      const colors = getEffectiveColors();
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x+22, y+50, 15, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.ellipse(x+22, y+30, 15, 19, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = colors.belly; ctx.beginPath(); ctx.ellipse(x+22, y+32, 10, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.arc(x+31, y+14, 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x+27, y+11, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+38, y+11, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+28, y+11, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+39, y+11, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = colors.secondary; ctx.beginPath(); ctx.ellipse(x+10, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+26, y+46, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = colors.primary; ctx.beginPath(); ctx.arc(x+24, y+5, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+40, y+5, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = colors.primary; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x+5, y+40); ctx.quadraticCurveTo(x-8, y+32, x-5, y+20); ctx.stroke();

      ctx.fillStyle = score >= 25000 ? '#fff' : '#212121';
      ctx.font = 'bold 20px "Courier New"'; ctx.fillText(`${currentCharacter.name}: ${score}`, 20, 45);
      if (gameOver && !continueActive) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT); ctx.fillStyle = '#fff'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center'; ctx.fillText('💀 КОНЕЦ ИГРЫ', CANVAS_WIDTH/2, CANVAS_HEIGHT/2); ctx.textAlign = 'left'; }
    }

    function gameLoop() { update(); draw(); gameLoopId = requestAnimationFrame(gameLoop); }

    // ============ ОБРАБОТЧИКИ ============
    canvas.addEventListener('click', e => { 
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      e.preventDefault(); attemptJump(); 
    });
    canvas.addEventListener('touchstart', e => {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      e.preventDefault(); attemptJump();
    });

    pauseButton.addEventListener('click', e => { e.stopPropagation(); togglePause(); });
    inGameMenuBtn.addEventListener('click', e => { e.stopPropagation(); openMenu(); });
    continueYes.addEventListener('click', e => { e.stopPropagation(); continueGame(); });
    continueNo.addEventListener('click', e => { e.stopPropagation(); declineContinue(); });
    musicToggle.addEventListener('click', e => { e.stopPropagation(); });

    window.addEventListener('keydown', e => {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); attemptJump(); }
      if (e.key === 'Escape') { e.preventDefault(); if (menuOpen) closeMenu(); else togglePause(); }
    });

    function resetDailyIfNeeded() {
      const today = new Date().toDateString();
      if (lastDailyReset !== today) { dailyClaimed = [false,false,false,false]; lastDailyReset = today; generateDailyQuests(); saveData(); }
    }

    function startGame() {
      resetDailyIfNeeded();
      if (!dailyQuests.length) generateDailyQuests();
      updateUI();
      resetGame();
      gameLoop();
    }

    // ЗАПУСК
    console.log('Запуск игры...');
    showAuth();
    setInterval(() => { saveData(); if (isAuthenticated && !playerId.startsWith('local_')) saveToCloud(); }, 30000);
  }

  // Запускаем инициализацию
  initApp().catch(err => console.error('Ошибка инициализации:', err));
</script>
</body>
</html>
